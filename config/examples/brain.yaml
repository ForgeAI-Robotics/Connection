# Public template: copy to the corresponding local filename; never commit live settings.
audio:
  sample_rate: 16000
  channels: 1
  duration: 5
  exceed_time: 20
  threshold: 2000
  silence_duration: 5
  audio_record_enable: false
  audio_file_path: ./tmp_audio.wav
tts:
  tts_speak_enable: false
  tts_random_seed: 1924
  tts_output_file: ./tts_audio.wav
model:
  model_select: deepseek-chat
  model_retry_planning: 5
  # 可按模型官方配置调整；不设置时保持原生成参数。
  # max_tokens: 32768
  # temperature: 1.0
  # top_p: 0.95
  # presence_penalty: 1.5
  # extra_body: {top_k: 20, chat_template_kwargs: {enable_thinking: true}}
  model_dict:
    cloud_model: deepseek-chat
    cloud_type: default
    cloud_api_key: ${CLOUD_API_KEY}
    cloud_server: https://api.deepseek.com/
    max_chat_message: 50
collaborator:
  host: 127.0.0.1
  port: 6379
  db: 0
  clear: false
  password: null
logger:
  master_logger_name: GlobalAgent
  master_logger_level: DEBUG
  master_logger_file: .logs/master_agent.log
  robot_memory_yaml: .log/robot_memory.yaml
profiling: true
profile:
  path: config/scene/profile.yaml
experience:
  exploration_rate: 0.8
  auto_save_on_success: true
camera:
  enabled: false
reflection:
  # Candidates go to data/memory/reflections/; generated SOPs go to data/business/.
  enabled: true
  use_llm: true
  write_sop: false
  # 候选规则发布目录。不设置时，新任务不绑定规则版本。
  # release_dir: data/releases
brain:
  # 视觉任务的步骤期限（默认 30 秒）；长思考模型需与视觉 HTTP 超时分别核对。
  # observation_timeout_sec: 1800
  reasoning:
    # 明确的 SOP 触发词直接命中；其它任务由 LLM 选择业务包，再按现场能力规划。
    semantic_selection: true
    # 异常建议写入账本和状态页，不自动重试、改路线或放宽核验。
    recovery_advice: true
    # 仅部署并验收建议确认闭环后开启；未确认不会自动执行模型建议。
    confirm_recovery_advice: false
    # 新任务绑定受限恢复策略：先只读刷新现场，再提议保留全部目标的剩余步骤安排。
    # 仍需人工逐次确认；旧任务没有此策略时沿用原行为。
    recovery_plans: true
    max_recovery_revisions: 2
  # 所有业务共用 Runtime；legacy 仅用于无在途任务时回退。
  scheduler: runtime
  # 通用任务沿用 robot_api 的 active_backend，不强制改成仿真。
  reception_backend: mock
reception_real:
  enabled: false
  # 空值使用随代码封存的 reception_single_can_v1.yaml；显式路径相对 CONNECTION_WORKSPACE。
  # 文件需先通过 scripts/reception_skill.py 离线校验；新点位仍须符合下游合同。
  skill_file: ""
  # 五点新版：src/brain/packages/definitions/reception_single_can_v2.yaml
  # SIMPLE O6 新房子需部署同一份 navigation_legs；启动任务前会比对。
  contract_version: fq/reception-lan/v1
  dream_base_url: ${DREAM_BASE_URL}
  vla_base_url: ${VLA_BASE_URL}
  # 所有真实 NAV（含操控模拟）统一经网关；关闭时拒绝派发，不回退旧 relay。
  # 真实 VLA 业务未接入，旧账本须显式迁移；未知占用保留阻断。
  body_control:
    enabled: false
    robot_serial: ""
    permit_mode: control_session
    control_resource: ""  # g1:<robot_serial>:body
    action_endpoint: "tcp://127.0.0.1:5556"  # 网关看到的 NAV 来源，不是 SONIC 输入
    gateway_base_url: "https://<robot-host>:18001"
    gateway_ca_file: ""  # 受信任证书文件；正常校验证书及主机名
    gateway_token_env: BRAIN_GATEWAY_TOKEN  # 支持 BRAIN_GATEWAY_TOKEN_FILE
    gateway_timeout_sec: 2
    # 服务凭据只放环境变量，不存任务或控制账本。
    token_env: BRAIN_CONTROL_TOKEN
    # NAV HTTP 若使用独立 --api-token，可填保存该 token 的环境变量名；空值沿用上项。
    nav_token_env: ""
    operation_timeout_sec: 10
    poll_interval_sec: 0.05
    evidence_max_age_sec: 10
  # 通用身体任务的额外 VLA 动作目录；真机接待使用 Skill.real_workflow 并引用同一份 points。
  # 配置合同、暂停与授权确认 API 见 docs/接口说明_操控VLA.md。
  native_vla:
    points: {}
    operations: {}
  vla_result_policy: hand_state_only
  runtime_dir: data/retired/reception
  # 共用真机动作许可。接待或通用身体执行任一选真机时打开；两者均非真机时关闭。
  # 任务仍进入 Runtime，闸门未开时在派发前等待；不替代下游许可。
  kernel_enabled: false
  kernel_runtime_dir: data/tasks
  # 短时上下文窗口。只裁剪读取，不删除任务账本和未核清命令。
  event_memory_limit: 20
  event_memory_ttl_sec: 1800
  request_timeout_sec: 10
  dream_poll_interval_sec: 0.5
  vla_poll_interval_sec: 1.0
  navigation_timeout_sec: 900
  navigation_transport_timeout_sec: 30
  dream_inspection_enabled: false
  inspection_timeout_sec: 300
  camera_handoff_timeout_sec: 60
  door_lateral_timeout_sec: 300
  vla_timeout_sec: 600
  place_timeout_sec: 1800
  snapshot_timeout_sec: 30
  auto_retry_business_step: false
  camera_owner: vla
  grasp_camera_view: left_wrist
  place_camera_view: ego_view
  grasp_photo_verification_enabled: false
  place_photo_verification_enabled: false
  verification:
    min_vlm_confidence: 0.5
    vlm:
      model: qwen3-vl-plus
      api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      api_key_env: VLM_API_KEY
      timeout_sec: 120
      # 独立配置本地视觉核验时，可设 auth_required: false，并修改 model/api_base。
      # extra_body: {chat_template_kwargs: {enable_thinking: false}}
      # 核验的 llm 端点及核验规则不随 vlm 端点改变。
    llm:
      model: deepseek-chat
      api_base: https://api.deepseek.com
      api_key_env: CLOUD_API_KEY
      timeout_sec: 60
