# 修改后在管理面板应用，或运行 scripts/execution_mode.py apply。
# 改文件不会热切换在途任务。模块覆盖优先于全局选择。
mode: simulation
simulation_backend: desk
# 可选 desk / mujoco / mujoco_3dgs / simple_o7（远端抓可乐实验）
modules:
  reception:
    mode: inherit             # inherit / simulation / real / disabled
  execution:
    mode: inherit             # 通用任务和桌面整理
    simulation_backend: inherit
  observation:
    mode: inherit             # 现场观察及网页画面
    simulation_backend: inherit
# 接待仿真是 reception_mock；Desk 不出图。
# 应用真机接待会打开 config/brain.yaml 的 kernel_enabled；应用非真机接待会关闭。下游闸门仍可拦住派发。
# 全局 real 的观察走 VLA 头部取图；需要匹配版本的 VLA HTTP、相机和服务鉴权。
# 缺图／断流不会回落仿真；修改配置仍需显式应用，旧生效快照不自动升级。
