name: Offline contracts and publication audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install PyYAML Flask -r integrations/feishu/requirements.txt
      - name: Check publication contents
        run: python scripts/check_publication.py
      - name: Create safe local test configuration
        run: python scripts/bootstrap_local.py
      - name: Test Master contracts
        run: python -m unittest master.tests.test_reception_real master.tests.test_dream_route_policy -v
      - name: Test DREAM HTTP adapter
        run: python -m unittest serve_dream.test_agent_http -v
      - name: Test DREAM offline fixtures
        run: python serve_dream/selftest.py
      - name: Test Feishu adapter without live credentials
        run: python -m unittest discover -s integrations/feishu/tests -v
