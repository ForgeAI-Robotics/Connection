name: Offline contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install offline test dependencies
        run: python3 -m pip install -e '.[execution,feishu]' numpy rich
      - name: Create safe local test configuration
        run: python3 scripts/bootstrap_local.py
      - name: Run all offline tests
        run: python3 scripts/run_tests.py
