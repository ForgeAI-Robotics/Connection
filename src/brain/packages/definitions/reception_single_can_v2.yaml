# 2026-10-12 用户提供的新版点位；relay3 横移已由用户确认。
# 使用原 LAN v1 请求格式；远端仍须登记这五段路线，不代表已完成真机验收。
# YAML 是可执行的业务定义；核验、停止与交接要求由编译器推导，不能在此关闭。
schema_version: 2
contract_version: fq/reception-lan/v1
sop:
  id: reception.single_can
  version: "2"
  description: "单罐接待：table_2 抓取 cola_can_1，经 relay1、relay2、relay3 到 table_1 放置。"
  constraints: "固定一罐、固定物体与桌子；不包含开灯、人数补货、改路线或额外动作。"
  triggers: [开始接待, 启动接待, 执行接待, 开始单罐接待]
parameters:
  object_id: cola_can_1
  quantity: 1
points:
  table2:
    target_id: table_2
    route_phase: ""
    leg_index: 1
    goal_xyt: [-3.658864, 4.424073, 0.178434]
    motion_mode: forward_path
  relay1:
    target_id: relay_1
    route_phase: relay1_approach
    leg_index: 2
    goal_xyt: [-2.248818, -0.541162, 1.476931]
    motion_mode: forward_path
  relay2:
    target_id: door_1
    route_phase: door_approach
    leg_index: 3
    goal_xyt: [-2.423402, -6.008235, -3.021833]
    motion_mode: forward_path
  relay3:
    target_id: door_1
    route_phase: door_lateral_exit
    leg_index: 4
    goal_xyt: [-2.168660, -7.378595, -2.981830]
    motion_mode: lateral_path_aligned
  table1:
    target_id: table_1
    route_phase: table1_approach
    leg_index: 5
    goal_xyt: [-0.773222, -7.528610, 1.823351]
    motion_mode: forward_path
steps:
  - id: NAVIGATING_TO_TABLE2
    action: navigate
    point: table2
    command_prefix: nav-table2
    timeout_sec: 900
  - id: DREAM_INSPECTING_TABLE2
    action: inspect
    after_navigation: NAVIGATING_TO_TABLE2
    command_prefix: inspect-table2
    timeout_sec: 300
    optional: true
  - id: VLA_PICKING
    action: pick
    after_navigation: NAVIGATING_TO_TABLE2
    command_prefix: vla-pick
    timeout_sec: 600
    verification_id: VERIFYING_GRASP
  - id: NAVIGATING_TO_RELAY1
    action: navigate
    point: relay1
    command_prefix: nav-relay1
    timeout_sec: 900
  - id: NAVIGATING_TO_RELAY2
    action: navigate
    point: relay2
    command_prefix: nav-relay2
    timeout_sec: 900
  - id: LATERAL_TO_RELAY3
    action: navigate
    point: relay3
    command_prefix: nav-relay3
    timeout_sec: 300
  - id: NAVIGATING_TO_TABLE1
    action: navigate
    point: table1
    command_prefix: nav-table1
    timeout_sec: 900
  - id: VLA_PLACING
    action: place
    after_navigation: NAVIGATING_TO_TABLE1
    command_prefix: vla-place
    timeout_sec: 1800
    verification_id: VERIFYING_PLACE
