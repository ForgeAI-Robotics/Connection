# 已有接待基线。后续流程复制为新版本；不要覆盖这个版本来修改历史任务。
# YAML 是可执行的业务定义；核验、停止与交接要求由编译器推导，不能在此关闭。
schema_version: 1
contract_version: fq/reception-lan/v1
sop:
  id: reception.single_can
  version: "1"
  description: "单罐接待：table_2 抓取 cola_can_1，经 relay2、relay3 到 table_1 放置。"
  constraints: "固定一罐、固定物体与桌子；不包含开灯、人数补货、改路线或额外动作。"
  triggers: [开始接待, 启动接待, 执行接待, 开始单罐接待]
parameters:
  object_id: cola_can_1
  quantity: 1
points:
  table2:
    target_id: table_2
    route_phase: ""
    leg_index: 1
    goal_xyt: [0.9903405869861586, 1.3761315438191244, -0.39236607751253016]
    motion_mode: forward_path
  relay2:
    target_id: door_1
    route_phase: door_approach
    leg_index: 2
    goal_xyt: [3.733075988421528, 6.215369909530748, 2.718279944258407]
    motion_mode: forward_path
  relay3:
    target_id: door_1
    route_phase: door_lateral_exit
    leg_index: 3
    goal_xyt: [4.185939449618811, 7.560143924693016, 2.7689146673931306]
    motion_mode: lateral_path_aligned
  table1:
    target_id: table_1
    route_phase: table1_approach
    leg_index: 4
    goal_xyt: [3.0873798986272165, 8.279995338440145, 1.175238157458919]
    motion_mode: forward_path
steps:
  - id: NAVIGATING_TO_TABLE2
    action: navigate
    point: table2
    command_prefix: nav-table2
    timeout_sec: 900
  - id: DREAM_INSPECTING_TABLE2
    action: inspect
    after_navigation: NAVIGATING_TO_TABLE2
    command_prefix: inspect-table2
    timeout_sec: 300
    optional: true
  - id: VLA_PICKING
    action: pick
    after_navigation: NAVIGATING_TO_TABLE2
    command_prefix: vla-pick
    timeout_sec: 600
    verification_id: VERIFYING_GRASP
  - id: NAVIGATING_TO_RELAY2
    action: navigate
    point: relay2
    command_prefix: nav-relay2
    timeout_sec: 900
  - id: LATERAL_TO_RELAY3
    action: navigate
    point: relay3
    command_prefix: nav-relay3
    timeout_sec: 300
  - id: NAVIGATING_TO_TABLE1
    action: navigate
    point: table1
    command_prefix: nav-table1
    timeout_sec: 900
  - id: VLA_PLACING
    action: place
    after_navigation: NAVIGATING_TO_TABLE1
    command_prefix: vla-place
    timeout_sec: 1800
    verification_id: VERIFYING_PLACE
