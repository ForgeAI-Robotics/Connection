<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>FQPlanner 任务控制台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 8px; font-size: 22px; color: #38bdf8; }
        .subtitle { text-align: center; margin-bottom: 28px; font-size: 13px; color: #64748b; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
        .card h2 { font-size: 15px; color: #94a3b8; margin-bottom: 14px; }
        .input-group { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 14px; outline: none; }
        input[type="text"]:focus { border-color: #38bdf8; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; white-space: nowrap; }
        .btn-primary { background: #0ea5e9; color: #fff; }
        .btn-primary:hover { background: #0284c7; }
        .btn-outline { background: transparent; color: #94a3b8; border: 1px solid #334155; }
        .btn-outline:hover { border-color: #64748b; color: #e2e8f0; }
        .btn-sm { padding: 8px 14px; font-size: 13px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .result { margin-top: 14px; padding: 14px; background: #0f172a; border-radius: 8px; white-space: pre-wrap; font-size: 13px; font-family: monospace; display: none; max-height: 400px; overflow-y: auto; }
        .status-bar { display: flex; gap: 16px; justify-content: center; font-size: 13px; color: #64748b; margin-bottom: 20px; }
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .dot.ok { background: #22c55e; }
        .dot.err { background: #ef4444; }
        .msg { padding: 10px 14px; border-radius: 8px; margin-top: 10px; font-size: 13px; display: none; }
        .msg-ok { background: #052e16; color: #4ade80; border: 1px solid #166534; }
        .msg-err { background: #2a1215; color: #f87171; border: 1px solid #7f1d1d; }
        .tools-list { margin-top: 10px; }
        .tool-item { background: #0f172a; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
        .tool-name { color: #38bdf8; font-weight: bold; font-size: 14px; }
        .tool-desc { color: #94a3b8; font-size: 13px; margin-top: 4px; }
        .tool-params { color: #64748b; font-size: 12px; margin-top: 6px; font-family: monospace; }
        .param-tag { background: #334155; padding: 2px 8px; border-radius: 4px; margin-right: 4px; }
        .scene-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
        .scene-card { background: #0f172a; border-radius: 8px; padding: 12px; }
        .scene-name { color: #38bdf8; font-weight: bold; font-size: 14px; }
        .scene-type { color: #64748b; font-size: 12px; margin-left: 6px; }
        .scene-desc { color: #94a3b8; font-size: 13px; margin-top: 4px; }
        .scene-contains { color: #a78bfa; font-size: 12px; margin-top: 6px; font-family: monospace; }
        .scene-coords { color: #64748b; font-size: 11px; margin-top: 4px; font-family: monospace; }
        .update-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .update-row select { padding: 8px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 13px; outline: none; }
        .update-row select:focus { border-color: #38bdf8; }
        .task-progress { margin-top: 14px; }
        .task-progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .task-progress-header span { font-size: 13px; color: #94a3b8; }
        .task-bar { height: 6px; background: #334155; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
        .task-bar-fill { height: 100%; background: #22c55e; border-radius: 3px; transition: width 0.3s, background 0.3s; }
        .task-bar-fill.fail { background: #ef4444; }
        .task-progress-header .status-ok  { color: #4ade80; }
        .task-progress-header .status-fail { color: #f87171; }
        .task-progress-header .status-run  { color: #94a3b8; }
        .task-progress-header .status-recovery { color: #fbbf24; }
        .task-bar-fill.recovery { background: #f59e0b; }
        .subtask-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #0f172a; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
        .subtask-item.done { opacity: 0.7; }
        .subtask-item .check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #475569; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; font-weight: bold; line-height: 1; }
        .subtask-item .subtask-text { flex: 1; color: #e2e8f0; }
        .subtask-item.done.ok .subtask-text { text-decoration: line-through; color: #64748b; }
        .subtask-item.done.fail .subtask-text { color: #f87171; font-weight: 500; }
        .subtask-item .subtask-robot { color: #64748b; font-size: 12px; }
        .no-task { color: #64748b; font-size: 13px; margin-top: 10px; }
        .robot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .robot-info-box { background: #0f172a; border-radius: 8px; padding: 12px; }
        .robot-info-box h3 { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
        .robot-coord { font-family: monospace; font-size: 14px; color: #22c55e; }
        .robot-yaw { font-family: monospace; font-size: 14px; color: #38bdf8; }
        .robot-objects { margin-top: 10px; background: #0f172a; border-radius: 8px; padding: 12px; }
        .robot-objects h3 { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
        .obj-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; font-family: monospace; border-bottom: 1px solid #1e293b; }
        .obj-row:last-child { border-bottom: none; }
        .obj-name { color: #38bdf8; }
        .obj-pos { color: #94a3b8; }
        .obj-grasped { color: #f59e0b; font-size: 11px; }
        .report-card { margin-top: 14px; }
        .rc-head { font-size: 14px; font-weight: 600; margin-bottom: 8px; padding: 6px 10px; border-radius: 6px; }
        .rc-head.ok { background: #052e16; color: #4ade80; } .rc-head.no { background: #2a1215; color: #f87171; }
        .rc-check { font-size: 13px; color: #cbd5e1; padding: 3px 0 3px 6px; }
        .rc-check .ok { color: #22c55e; } .rc-check .no { color: #ef4444; }
        .rc-anom { font-size: 13px; color: #fbbf24; padding: 5px 0 3px 6px; }
        .rc-advice { font-size: 13px; color: #94a3b8; padding: 6px 0 0 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FQPlanner 任务控制台</h1>
        <div class="subtitle">统一 Runtime 任务系统</div>
        <div class="card"><h2>当前执行环境</h2><div id="execution-environment" style="white-space:pre-wrap;line-height:1.7">正在读取…</div></div>

        <div class="status-bar" id="status"></div>

        <!-- 机器人实时坐标 -->
        <div class="card">
            <h2>机器人坐标 <button class="btn btn-outline btn-sm" style="font-size:11px;padding:3px 8px;float:right" onclick="loadRobotStatus()">刷新</button></h2>
            <div id="robot-status-content">
                <div style="color:#64748b;font-size:13px">加载中...</div>
            </div>
        </div>

        <!-- 视频录制 -->
        <div class="card">
            <h2>视频录制</h2>
            <div class="btn-row" style="justify-content:center">
                <button class="btn btn-sm" id="btn-record" style="background:#dc2626;color:#fff" onclick="toggleRecord()">开始录制</button>
            </div>
            <div id="record-info" style="text-align:center;font-size:12px;color:#64748b;margin-top:6px"></div>
        </div>

        <!-- 四宫格：直播仿真 + 发任务后逐步截图回放 -->
        <div class="card">
            <h2 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <span>四宫格相机
                    <span style="font-size:12px;color:#64748b;font-weight:normal">（同一仿真的四路相机；3DGS 为俯视 / 头 / 右腕 / 左腕）</span>
                </span>
                <span style="margin-left:auto;display:flex;gap:6px">
                    <button class="btn btn-outline btn-sm" id="btn-quad-live" style="font-size:11px;padding:3px 8px" onclick="startLiveQuad()">直播</button>
                    <button class="btn btn-outline btn-sm" id="btn-quad-replay" style="font-size:11px;padding:3px 8px" onclick="startReplayQuad()">回放</button>
                    <button class="btn btn-outline btn-sm" style="font-size:11px;padding:3px 8px" onclick="loadTimeline()">刷新</button>
                </span>
            </h2>
            <div id="quad-meta" style="text-align:center;font-size:12px;color:#64748b;margin-bottom:6px"></div>
            <div style="text-align:center">
                <img id="quad-img" style="max-width:100%;border-radius:8px;background:#0f172a;min-height:120px" alt="四宫格">
            </div>
            <div id="timeline-controls" style="margin-top:10px;display:none">
                <input type="range" id="timeline-slider" min="0" max="0" value="0" style="width:100%" oninput="showFrame(this.value)">
                <div class="btn-row" style="justify-content:center;margin-top:6px">
                    <button class="btn btn-sm btn-outline" onclick="stepFrame(-1)">◀ 上一帧</button>
                    <button class="btn btn-sm" id="btn-play" onclick="playTimeline()">⏵ 播放</button>
                    <button class="btn btn-sm btn-outline" onclick="stepFrame(1)">下一帧 ▶</button>
                </div>
                <div id="frame-label" style="text-align:center;font-size:13px;color:#e2e8f0;margin-top:6px"></div>
            </div>
            <div id="timeline-empty" style="text-align:center;font-size:12px;color:#64748b;margin-top:6px"></div>
        </div>

        <!-- 任务发布 -->
        <div class="card">
            <h2>发布任务</h2>
            <div class="input-group">
                <input type="text" id="task" placeholder="输入任务，如：前往卧室" autofocus>
                <button class="btn btn-primary" id="btn-send" onclick="sendTask()">发送</button>
            </div>
            <div class="result" id="task-result"></div>
            <div class="task-progress" id="task-progress"></div>
            <div class="report-card" id="report-card"></div>
            <div class="btn-row" style="margin-top:10px">
                <button id="task-start" class="btn btn-sm" style="background:#0ea5e9;color:#fff" onclick="startReception()">🤝 开始接待</button>
                <button id="task-skip" class="btn btn-sm" style="background:#f59e0b;color:#111" onclick="controlReception('skip')">跳过继续</button>
                <button id="task-pause" class="btn btn-sm" style="background:#64748b;color:#fff" onclick="controlReception('pause')">暂停</button>
                <button id="task-continue" class="btn btn-sm" style="background:#22c55e;color:#fff" onclick="controlReception('continue')">继续</button>
                <button id="task-cancel" class="btn btn-sm" style="background:#ef4444;color:#fff" onclick="controlReception('cancel')">取消</button>
                <button class="btn btn-outline btn-sm" onclick="refreshTaskStatus()">刷新任务进度</button>
            </div>
        </div>

        <!-- 配置校验 -->
        <div class="card">
            <h2>配置校验</h2>
            <button class="btn btn-outline btn-sm" onclick="validateConfig()">校验配置</button>
            <div class="msg" id="validate-msg"></div>
        </div>

        <!-- 工具列表 -->
        <div class="card">
            <h2>已注册工具</h2>
            <button class="btn btn-outline btn-sm" onclick="loadTools()">刷新</button>
            <div class="tools-list" id="tools-list"></div>
        </div>

        <!-- 物体状态 (belief) -->
        <div class="card">
            <h2>物体状态 (belief)
                <span style="font-size:12px;color:#64748b;font-weight:normal">机器人记忆里每个物体在哪(非真值,随探索更新)</span>
                <button class="btn btn-outline btn-sm" style="font-size:11px;padding:3px 8px;float:right" onclick="loadBelief()">刷新</button>
            </h2>
            <div id="belief-updated" style="font-size:11px;color:#64748b;margin-bottom:8px"></div>
            <div id="belief-table"></div>
            <pre id="belief-json" style="margin-top:10px;padding:12px;background:#0f172a;border-radius:8px;font-size:12px;color:#a78bfa;overflow-x:auto;white-space:pre-wrap"></pre>
        </div>

        <!-- current SOP(最底部,生成新 SOP 时在此基础上 update) -->
        <div class="card">
            <h2>当前 SOP
                <span style="font-size:12px;color:#64748b;font-weight:normal">桌面整理规则(事后反思生成新版时在此基础上 update)</span>
                <button class="btn btn-outline btn-sm" style="font-size:11px;padding:3px 8px;float:right" onclick="loadSop()">刷新</button>
            </h2>
            <div id="sop-content" style="font-size:13px;color:#cbd5e1;line-height:1.7"></div>
        </div>
    </div>

    <script>
        // 状态检测
        async function checkStatus() {
            try {
                const resp = await fetch('/api/task_status');
                if (!resp.ok) throw new Error('offline');
                document.getElementById('status').innerHTML = '<span><span class="dot ok"></span>Master 在线</span>';
            } catch {
                document.getElementById('status').innerHTML = '<span><span class="dot err"></span>Master 离线</span>';
            }
        }
        checkStatus();
        setInterval(checkStatus, 5000);

        // 当前 SOP(最底部卡片) —— 事后反思生成新版时在此基础上 update
        async function loadSop() {
            const el = document.getElementById('sop-content');
            try {
                const d = await (await fetch('/api/sop')).json();
                if (!d.success) { el.textContent = 'SOP 加载失败: ' + (d.error || ''); return; }
                const s = d.sop || {};
                const sec = (title, items) => items && items.length
                    ? `<div style="margin-bottom:10px"><b style="color:#a78bfa">${title}</b>`
                      + `<ul style="margin:4px 0 0 18px;padding:0">`
                      + items.map(i => `<li>${i}</li>`).join('') + '</ul></div>'
                    : '';
                el.innerHTML =
                    sec('桌面最终状态', (s.standard_layout || []).map(x => `${x.category}: ${x.count ?? x.state ?? ''} — ${x.rule || ''}`))
                  + sec('必须清理的垃圾', (s.trash || []).map(x => `${x.type} → ${x.action}`))
                  + sec('必须保持原位', (s.keep_in_place || []).map(x => `${x.type}: ${x.rule}`))
                  + sec('饮料补货', (s.restock || []).map(x => `${x.item}: 标准 ${x.min} 个,不足去${x.source}补`))
                  + sec('经验规则(大脑优化生成)', s.learned_rules || []);
            } catch (e) { el.textContent = 'SOP 加载失败: ' + e; }
        }
        loadSop();

        function showMsg(id, ok, text) {
            const el = document.getElementById(id);
            el.className = 'msg ' + (ok ? 'msg-ok' : 'msg-err');
            el.textContent = text;
            el.style.display = 'block';
        }

        let taskSubmitting = false, taskControlPending = false, displayedTask = null;
        async function readTaskStatus() {
            const response = await fetch('/api/task_status');
            const data = await response.json();
            if (!response.ok || !data || !Object.prototype.hasOwnProperty.call(data, 'state')) {
                throw new Error('无法确认当前任务状态，请检查大脑连接后刷新');
            }
            return data;
        }
        function updateTaskButtons() {
            const state = displayedTask?.state;
            const active = !!displayedTask?.task_id && !displayedTask.terminal;
            const enabled = {
                start: !taskSubmitting && !taskControlPending && !active,
                skip: !taskControlPending && !!displayedTask?.can_skip,
                pause: !taskControlPending && ['running', 'verifying'].includes(state),
                continue: !taskControlPending && !!displayedTask?.can_resume,
                cancel: !taskControlPending && active
            };
            for (const [name, allowed] of Object.entries(enabled)) {
                const button = document.getElementById('task-' + name);
                button.disabled = !allowed;
                button.title = allowed ? '' : (taskControlPending ? '控制请求处理中' : '当前任务状态不支持此操作');
            }
        }
        // 发布任务
        async function sendTask(options) {
            options = options || {};
            const task = document.getElementById('task').value.trim();
            if (!task || taskSubmitting) return;
            taskSubmitting = true;
            updateTaskButtons();
            const btn = document.getElementById('btn-send');
            const result = document.getElementById('task-result');
            btn.disabled = true;
            btn.textContent = '发送中...';
            result.style.display = 'block';
            result.textContent = '等待响应...';
            try {
                const intentResp = await fetch('/api/task_intent', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({task: task})
                });
                const intent = await intentResp.json();
                if (intent.intent === 'control') {
                    await controlReception(intent.action);
                    return;
                }
                if (intent.intent === 'chat') {
                    result.textContent = '识别为闲聊，未发送给大脑。机器人任务请说「开始接待」「桌上有什么」等。';
                    return;
                }
                if (intent.requires_confirmation && !options.skipConfirm) {
                    const kind = intent.risk === 'motion' ? '运动任务' : '机器人任务';
                    if (!window.confirm('将作为' + kind + '发给大脑：\n' + task)) {
                        result.textContent = '已取消';
                        return;
                    }
                }
                const st = await readTaskStatus();
                if (st.blocks_new_motion) {
                    result.textContent = st.blocked_reason || '存在未完成任务，请先暂停、继续或取消原任务。';
                    return;
                }
                const preflightResp = await fetch('/api/task_preflight', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({task: task})
                });
                const preflight = await preflightResp.json();
                if (preflight.required && preflight.ready === false) {
                    result.textContent = '预检未通过:\n' + JSON.stringify(preflight, null, 2);
                    return;
                }
                const payload = {task: task};
                if (options.forceNewTask) payload.force_new_task = true;
                const resp = await fetch('/publish_task', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await resp.json();
                result.textContent = JSON.stringify(data, null, 2);
                if (data.accepted === false) {
                    return;
                }
                if (data.status === 'success') {
                    _prevAllDone = false;
                    startTaskPolling();
                }
            } catch (e) {
                result.textContent = '请求失败: ' + e.message;
            } finally {
                taskSubmitting = false;
                updateTaskButtons();
                btn.disabled = false;
                btn.textContent = '发送';
                document.getElementById('task').value = '';
            }
        }
        // 会议接待:一键触发(填"开始接待"→ master 命中接待 skill → 复用 task_status 显示 🧠+子任务✓)
        function startReception() {
            document.getElementById('task').value = '开始接待';
            sendTask({skipConfirm: true});
        }
        async function controlReception(action) {
            if (taskControlPending) return;
            const result = document.getElementById('task-result');
            const target = displayedTask?.task_id;
            const skipStep = displayedTask?.skip_step_id;
            const continueStep = displayedTask?.control_step_id;
            const continueCommand = displayedTask?.control_command_id || '';
            taskControlPending = true;
            updateTaskButtons();
            result.style.display = 'block';
            try {
                const current = await readTaskStatus();
                if (target && current.task_id !== target) throw new Error('任务已变化，请刷新进度后再操作');
                if (!current.task_id || current.terminal) {
                    result.textContent = '当前没有进行中的任务，无需操作。';
                    return;
                }
                if (action === 'continue' && ((current.control_step_id || '') !== (continueStep || '')
                        || (current.control_command_id || '') !== continueCommand)) {
                    throw new Error('当前环节或命令已变化，请刷新后重试');
                }
                if (action === 'skip') {
                    if (!current.can_skip || !skipStep || current.skip_step_id !== skipStep) {
                        throw new Error('当前失败步骤已变化或不可跳过，请刷新后重试');
                    }
                    if (!window.confirm(`跳过 ${skipStep} 并进入下一步？该步骤不会记为成功；下一步仍需满足真实接口的前置条件。`)) return;
                }
                result.textContent = '正在发送控制请求...';
                const resp = await fetch('/api/task_' + action, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({task_id: current.task_id, ...(action === 'skip' ? {step_id: skipStep} : {}),
                        ...(action === 'continue' ? {step_id: continueStep || '', expected_command_id: continueCommand} : {})})
                });
                const data = await resp.json();
                if (!resp.ok || data.accepted === false) throw new Error(data.error || '控制未被受理');
                const labels = {paused: '已暂停；继续将核对原动作，未完成则重新下发当前环节。',
                    running: '继续请求已受理；结果以下方任务进度为准。', verifying: '正在核验原任务结果。',
                    cancelled: '已取消，停止已确认。', cancelling: '取消已受理，仍在确认停止。',
                    recovery_required: '前置条件或执行结果尚未满足，请查看任务中的具体原因。'};
                result.textContent = data.error || data.message || (data.retry_prepared ? '当前环节的新尝试已准备，前置检查通过后下发；执行结果见任务进度。' : null) || (action === 'skip'
                    ? `已人工跳过 ${data.skipped_step_id}；${data.next_step_id ? '下一步：' + data.next_step_id + '，执行结果见任务进度。' : '流程结束，含跳过，未全部成功。'}`
                    : labels[data.state] || '控制请求已受理。');
            } catch (e) {
                result.textContent = '控制请求未完成：' + e.message;
            } finally {
                await refreshTaskStatus();
                taskControlPending = false;
                updateTaskButtons();
            }
        }
        document.getElementById('task').addEventListener('keydown', e => { if (e.key === 'Enter') sendTask(); });

        // 任务进度
        let taskPollingTimer = null;

        function taskText(value) {
            const node = document.createElement('span');
            node.textContent = String(value ?? '');
            return node.innerHTML;
        }

        function renderTaskProgress(data) {
            displayedTask = data;
            updateTaskButtons();
            if (!data.all_done) document.getElementById('report-card').innerHTML = '';
            const el = document.getElementById('task-progress');
            if (!data.active && !data.all_done && data.state !== 'succeeded' && data.state !== 'cancelled' && data.state !== 'failed') {
                el.innerHTML = '<div class="no-task">暂无执行中的任务</div>';
                return;
            }
            const completed = Number(data.completed) || 0;
            const total = Number(data.total) || 0;
            const pct = total > 0 ? Math.round(completed / total * 100) : 0;
            const taskName = Array.isArray(data.task) ? data.task[0] : (data.task || '');
            const recovery = data.state === 'RECOVERY_REQUIRED' || data.state === 'recovery_required';
            const anyFailed = !recovery && (data.failed || (data.subtask_list || []).some(
                t => t.done && t.status && t.status !== 'success' && t.status !== 'blocked'
            ));
            // MuJoCo 判定:任务成功 = 所有子任务都成功(不再用 ALFWorld 的 won 覆盖)。
            // won===true 时额外标"落点已验证"徽章;won===false 是 MuJoCo 非持续模式默认值,不代表失败,忽略。
            const wonSignal = data.hasOwnProperty('won') ? data.won : null;
            let statusLabel, statusCls;
            if (recovery) {
                const reason = (data.reception_state && data.reception_state.failure_reason) || data.blocked_reason || data.reasoning || '';
                statusLabel = reason ? ('待恢复：' + reason) : '待恢复（未确认远端已停）';
                statusCls = 'status-recovery';
            } else if (data.state === 'paused') {
                statusLabel = '已暂停';
                statusCls = 'status-run';
            } else if (data.state === 'waiting_human') {
                statusLabel = '等待人工';
                statusCls = 'status-run';
            } else if (data.state === 'cancelling') {
                statusLabel = '取消中，停止尚未核清';
                statusCls = 'status-recovery';
            } else if (data.state === 'cancelled') {
                statusLabel = '已取消';
                statusCls = 'status-fail';
            } else if (data.state === 'failed') {
                statusLabel = data.flow_finished ? '流程结束（含人工跳过，未全部成功）' : '已失败';
                statusCls = 'status-fail';
            } else if (data.all_done || data.state === 'succeeded') {
                if (anyFailed) {
                    statusLabel = '✕ 任务失败(有子任务失败)';
                    statusCls = 'status-fail';
                } else {
                    statusLabel = data.execution_backend === 'reception_protocol' ? '✓ 协议模拟完成'
                        : wonSignal === true ? '✓ 任务成功(落点已验证)' : '✓ 任务成功';
                    statusCls = 'status-ok';
                }
            } else {
                statusLabel = '执行中...';
                statusCls = 'status-run';
            }
            const barCls = recovery ? 'task-bar-fill recovery' : (anyFailed ? 'task-bar-fill fail' : 'task-bar-fill');
            let html = `<div class="task-progress-header">
                <span>${taskText(taskName)} (${completed}/${total})${data.execution_backend === 'reception_protocol' ? ' · 导航／操控模拟' : ''}</span>
                <span class="${statusCls}">${statusLabel}</span>
            </div>
            <div class="task-bar"><div class="${barCls}" style="width:${pct}%"></div></div>`;

            if (data.reasoning) {
                html += `<div style="margin:10px 0;padding:10px 12px;background:#0f172a;border-radius:8px;font-size:12px;color:#a5b4fc;line-height:1.6">`
                      + `<b style="color:#818cf8">🧠 Master 思考:</b> ${data.reasoning}</div>`;
            }

            const advice = data.recovery_advice;
            if (advice && advice.applicable) {
                const actions = {query_original: '查询原命令', request_help: '请求人工协助',
                    wait: '等待条件就绪', cancel: '取消任务', continue: '通过原任务入口继续'};
                html += `<div style="margin:10px 0;padding:10px 12px;background:#0f172a;border-radius:8px;font-size:12px;line-height:1.6">`
                    + `<b>异常分析${advice.source === 'llm' ? '' : '（规则回退）'}</b><br>`
                    + `${taskText(advice.summary)}<br>${taskText(advice.reason)}<br>`
                    + `建议：${taskText(actions[advice.action] || advice.action)}。建议尚未执行。</div>`;
            }

            for (const t of (data.subtask_list || [])) {
                const skipped = t.status === 'skipped';
                const blocked = t.done && (t.status === 'blocked' || skipped);
                const failed = t.done && t.status && t.status !== 'success' && t.status !== 'blocked' && !skipped;
                const cls = t.done ? (failed ? 'done fail' : (blocked ? 'done' : 'done ok')) : '';
                const insertedTag = t.inserted
                    ? ' <span style="font-size:10px;color:#fbbf24;border:1px solid #fbbf24;border-radius:4px;padding:1px 5px">↻ 失败重插</span>'
                    : '';
                const blockedTag = blocked
                    ? ' <span style="font-size:10px;color:#fbbf24;border:1px solid #475569;border-radius:4px;padding:1px 5px">' + (skipped ? '人工跳过，未确认成功' : '未执行') + '</span>'
                    : '';
                let checkStyle = 'border-color:#475569;';
                let checkIcon = '';
                if (t.done) {
                    if (failed) {
                        checkStyle = 'background:#ef4444;border-color:#ef4444;color:#fff;';
                        checkIcon = '✕';
                    } else if (blocked) {
                        checkStyle = 'background:#334155;border-color:#475569;color:#cbd5e1;';
                        checkIcon = '⊘';
                    } else {
                        checkStyle = 'background:#22c55e;border-color:#22c55e;color:#fff;';
                        checkIcon = '✓';
                    }
                }
                html += `<div class="subtask-item ${cls}">
                    <div class="check" style="${checkStyle}">${checkIcon}</div>
                    <span class="subtask-text">${taskText(t.subtask)}${insertedTag}${blockedTag}</span>
                    <span class="subtask-robot">${t.robot_name}</span>
                </div>`;
            }
            el.innerHTML = html;
        }

        let _prevAllDone = false;   // 上一次轮询时任务是否已完成(用于只在"刚完成"那一刻快照 belief)
        async function refreshTaskStatus() {
            try {
                const data = await readTaskStatus();
                renderTaskProgress(data);
                // 任务从「进行中」→「完成」的那一刻:belief 快照 + 拉接待完成确认报告
                const finished = !!data.task_id && data.all_done && data.terminal !== false
                    && data.state !== 'RECOVERY_REQUIRED'
                    && data.state !== 'recovery_required';
                if (finished && !_prevAllDone) {
                    loadBelief('任务结束');
                    loadReceptionReport();
                }
                _prevAllDone = !!finished;
                if (data.active && !data.all_done) {
                    // 只在没启动轮询时才启动（手动刷新按钮触发时需要）
                    if (!taskPollingTimer) startTaskPolling();
                } else {
                    stopTaskPolling();
                }
            } catch (e) {
                document.getElementById('task-progress').innerHTML = '<div class="no-task">查询失败</div>';
            }
        }

        // 接待完成确认报告：从 Master 的当前 Runtime 读取。
        async function loadReceptionReport() {
            const el = document.getElementById('report-card');
            const _e = s => (s==null?'':String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
            try {
                const d = await (await fetch('/api/reception/report')).json();
                if (!d.success || !d.report) { el.innerHTML = ''; return; }
                const r = d.report;
                const checks = (r.checks||[]).map(c =>
                    `<div class="rc-check"><span class="${c.pass?'ok':'no'}">${c.pass?'✓':'✗'}</span> ${_e(c.name)}：${_e(c.detail)}</div>`).join('');
                const anom = (r.anomalies&&r.anomalies.length)
                    ? `<div class="rc-anom">⚠ 异常：${_e(r.anomalies.join('；'))}</div>` : '';
                el.innerHTML = `<div class="rc-head ${r.verdict?'ok':'no'}">📋 完成确认报告 · ${r.verdict?'✅ 完成':'❌ 未完成'}</div>`
                    + checks + anom + `<div class="rc-advice">→ ${_e(r.advice)}</div>`;
            } catch (e) { el.innerHTML = ''; }
        }

        function startTaskPolling() {
            stopTaskPolling();
            refreshTaskStatus();
            taskPollingTimer = setInterval(refreshTaskStatus, 1000);
            startTimelineRefresh();  // 任务执行时四宫格时间线随之采集/更新为该任务
        }

        function stopTaskPolling() {
            if (taskPollingTimer) {
                clearInterval(taskPollingTimer);
                taskPollingTimer = null;
            }
            stopTimelineRefresh();
        }

        // —— 外部触发(NX 语音等)的任务自动显示,但【只认新任务】,不误显示上一次的残留 ——
        // 页面加载先把当前 task_id 记为"已知(残留)"、不显示;之后出现【新 task_id】才是刚被语音触发的,自动弹出
        let _autoSeenTaskId = null;
        async function autoDetectNewTask() {
            if (taskPollingTimer) return;                 // 已在快速轮询,不干预
            try {
                const d = await (await fetch('/api/task_status')).json();
                const tid = d.task_id || '';
                if (_autoSeenTaskId === null) {
                    _autoSeenTaskId = tid;
                    displayedTask = d;
                    updateTaskButtons();
                    if (d.state === 'RECOVERY_REQUIRED' || d.state === 'recovery_required' || (d.blocks_new_motion && d.active && !d.all_done)) {
                        startTaskPolling();
                    }
                    return;
                }
                if (tid && tid !== _autoSeenTaskId && d.active) {                 // 新 task_id = 刚被外部触发
                    _autoSeenTaskId = tid;
                    _prevAllDone = false;
                    startTaskPolling();
                }
            } catch (e) {}
        }
        setInterval(autoDetectNewTask, 3000);

        // 任务执行期间跟时间线：每步做完截一帧，四宫格切到回放看最新截图
        let timelineRefreshTimer = null, timelineEndTimer = null;
        function startTimelineRefresh() {
            if (timelineRefreshTimer) { clearInterval(timelineRefreshTimer); timelineRefreshTimer = null; }
            if (timelineEndTimer) { clearTimeout(timelineEndTimer); timelineEndTimer = null; }
            followTimeline = true;
            loadTimeline(true);
            timelineRefreshTimer = setInterval(() => loadTimeline(true), 5000);
        }
        function stopTimelineRefresh() {
            if (timelineRefreshTimer) { clearInterval(timelineRefreshTimer); timelineRefreshTimer = null; }
            if (timelineEndTimer) clearTimeout(timelineEndTimer);
            timelineEndTimer = setTimeout(() => loadTimeline(true), 4000);  // 任务结束后补拉一次,带上"完成"帧
        }

        // 经验教训改由机器人任务后自行总结,前端不再手动录入(已移除失败/成功经验弹窗)。

        // 配置校验 - 自动检测
        async function validateConfig() {
            try {
                const resp = await fetch('/api/validate-config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({})
                });
                const data = await resp.json();
                showMsg('validate-msg', data.success, data.success ? '配置校验通过' : data.message);
            } catch (e) {
                showMsg('validate-msg', false, '请求失败: ' + e.message);
            }
        }

        // 工具列表 - 自动从 Redis 读取
        async function loadTools() {
            try {
                const resp = await fetch('/api/auto_tools');
                const data = await resp.json();
                if (!data.success) {
                    document.getElementById('tools-list').innerHTML = `<div style="color:#ef4444;font-size:13px">${data.message}</div>`;
                    return;
                }
                if (data.data.length === 0) {
                    document.getElementById('tools-list').innerHTML = '<div style="color:#64748b;font-size:13px;margin-top:10px">暂无工具，请先启动 Slaver</div>';
                    return;
                }
                document.getElementById('tools-list').innerHTML = data.data.map(t => {
                    const params = (t.parameters || []).map(p =>
                        `<span class="param-tag">${p.name}: ${t.type || p.type}</span>`
                    ).join('');
                    return `<div class="tool-item">
                        <div style="display:flex;align-items:center;gap:8px">
                            <span class="tool-name">${t.name}</span>
                            <span style="color:#64748b;font-size:12px">${t.robot}</span>
                        </div>
                        <div class="tool-desc">${t.description || '无描述'}</div>
                        ${params ? '<div class="tool-params">' + params + '</div>' : ''}
                    </div>`;
                }).join('');
            } catch (e) {
                document.getElementById('tools-list').innerHTML = '<div style="color:#ef4444;font-size:13px">加载失败: ' + e.message + '</div>';
            }
        }
        loadTools();
        setInterval(loadTools, 10000);

        // 物体状态 (belief): 机器人记忆里每个物体在哪 {obj:{location}}。任务结束会打快照。
        async function loadBelief(snapshotLabel) {
            const tableEl = document.getElementById('belief-table');
            const jsonEl = document.getElementById('belief-json');
            try {
                const resp = await fetch('/api/belief');
                const data = await resp.json();
                const objs = data.objects || {};
                const names = Object.keys(objs).sort();
                if (!names.length) {
                    tableEl.innerHTML = '<div style="color:#64748b;font-size:13px">暂无物体记忆（belief 为空）</div>';
                    jsonEl.textContent = '{}';
                } else {
                    tableEl.innerHTML = names.map(n => {
                        const loc = (objs[n] && objs[n].location) || 'unknown';
                        const color = loc === 'robot_hand' ? '#f59e0b'
                                    : (loc === 'unknown' ? '#64748b' : '#22c55e');
                        return `<div class="obj-row"><span class="obj-name">${n}</span>` +
                               `<span style="color:${color};font-family:monospace">${loc}</span></div>`;
                    }).join('');
                    const pretty = {};
                    for (const n of names) pretty[n] = { location: (objs[n] || {}).location || 'unknown' };
                    jsonEl.textContent = JSON.stringify(pretty, null, 2);
                }
                const stamp = snapshotLabel ? '📌 ' + snapshotLabel + ' · ' : '';
                document.getElementById('belief-updated').textContent =
                    stamp + '更新于 ' + new Date().toLocaleTimeString();
            } catch (e) {
                tableEl.innerHTML = `<div style="color:#ef4444;font-size:13px">加载失败: ${e.message}</div>`;
            }
        }
        loadBelief();
        setInterval(loadBelief, 5000);

        // 机器人实时坐标
        async function loadRobotStatus() {
            const el = document.getElementById('robot-status-content');
            try {
                const resp = await fetch('/api/robot_status');
                const data = await resp.json();
                if (data.error) {
                    el.innerHTML = `<div style="color:#ef4444;font-size:13px">${data.error}</div>`;
                    return;
                }

                const robot = data.robot || {};
                const bp = robot.base_pos || [0, 0, 0];
                const ep = robot.ee_pos || [0, 0, 0];
                const yaw = (robot.yaw || 0).toFixed(1);

                let html = `<div class="robot-grid">
                    <div class="robot-info-box">
                        <h3>底盘位置</h3>
                        <div class="robot-coord">[${bp.map(v => v.toFixed(3)).join(', ')}]</div>
                    </div>
                    <div class="robot-info-box">
                        <h3>末端位置</h3>
                        <div class="robot-coord">[${ep.map(v => v.toFixed(3)).join(', ')}]</div>
                    </div>
                </div>
                <div style="margin-top:8px;font-size:13px;color:#94a3b8">朝向: <span class="robot-yaw">${yaw}°</span></div>`;

                // 物体列表
                const objects = data.objects || {};
                const objNames = Object.keys(objects);
                if (objNames.length > 0) {
                    html += `<div class="robot-objects"><h3>物体</h3>`;
                    for (const [name, info] of Object.entries(objects)) {
                        const pos = (info.pos || []).map(v => v.toFixed(3)).join(', ');
                        const grasped = info.grasped ? '<span class="obj-grasped"> grasped</span>' : '';
                        html += `<div class="obj-row">
                            <span class="obj-name">${name}${grasped}</span>
                            <span class="obj-pos">[${pos}]</span>
                        </div>`;
                    }
                    html += `</div>`;
                }

                el.innerHTML = html;
            } catch (e) {
                el.innerHTML = `<div style="color:#ef4444;font-size:13px">加载失败: ${e.message}</div>`;
            }
        }
        loadRobotStatus();
        setInterval(loadRobotStatus, 2000);

        // 视频录制
        let isRecording = false;
        let recordPollTimer = null;

        async function toggleRecord() {
            const btn = document.getElementById('btn-record');
            if (!isRecording) {
                // 开始录制
                try {
                    const resp = await fetch('/api/record/start', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({fps: 1})});
                    const data = await resp.json();
                    if (data.success) {
                        isRecording = true;
                        btn.textContent = '停止录制';
                        btn.style.background = '#16a34a';
                        pollRecordStatus();
                    } else {
                        alert(data.message || '启动录制失败');
                    }
                } catch (e) {
                    alert('请求失败: ' + e.message);
                }
            } else {
                // 停止录制
                btn.disabled = true;
                btn.textContent = '保存中...';
                try {
                    const resp = await fetch('/api/record/stop', {method: 'POST'});
                    const data = await resp.json();
                    if (data.success) {
                        const info = document.getElementById('record-info');
                        info.innerHTML = `<span style="color:#22c55e">已保存 ${data.frames} 帧 (${data.duration}s)</span> ` +
                            `<a href="/api/record/download/${data.filename}" style="color:#38bdf8" download>下载视频</a>`;
                    } else {
                        alert(data.message || '录制失败');
                    }
                } catch (e) {
                    alert('请求失败: ' + e.message);
                }
                isRecording = false;
                if (recordPollTimer) { clearInterval(recordPollTimer); recordPollTimer = null; }
                btn.textContent = '开始录制';
                btn.style.background = '#dc2626';
                btn.disabled = false;
            }
        }

        async function pollRecordStatus() {
            if (recordPollTimer) clearInterval(recordPollTimer);
            recordPollTimer = setInterval(async () => {
                if (!isRecording) return;
                try {
                    const resp = await fetch('/api/record/status');
                    const data = await resp.json();
                    if (data.active) {
                        document.getElementById('record-info').innerHTML =
                            `<span style="color:#f59e0b">● 录制中... ${data.frames} 帧</span>`;
                    }
                } catch (e) {}
            }, 1000);
        }

        // ── 四宫格：直播仿真；本页/飞书发任务后逐步截图，可回放 ──
        let tlFrames = [], tlPlayTimer = null, liveTimer = null, liveMode = true, followTimeline = false;

        function markQuadMode(mode) {
            const liveBtn = document.getElementById('btn-quad-live');
            const replayBtn = document.getElementById('btn-quad-replay');
            if (liveBtn) {
                liveBtn.style.borderColor = mode === 'live' ? '#38bdf8' : '#334155';
                liveBtn.style.color = mode === 'live' ? '#38bdf8' : '#94a3b8';
            }
            if (replayBtn) {
                replayBtn.style.borderColor = mode === 'replay' ? '#38bdf8' : '#334155';
                replayBtn.style.color = mode === 'replay' ? '#38bdf8' : '#94a3b8';
                replayBtn.disabled = !tlFrames.length;
            }
        }

        function stopLiveQuad() {
            liveMode = false;
            if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
        }

        function startLiveQuad() {
            stopPlay();
            followTimeline = false;
            liveMode = true;
            markQuadMode('live');
            const img = document.getElementById('quad-img');
            const empty = document.getElementById('timeline-empty');
            if (empty) {
                empty.textContent = tlFrames.length
                    ? '正在直播。点「回放」可拖进度条看每步做完的截图。'
                    : '正在直播。在本页或飞书发任务后，每步做完会截一帧，这里就能回放。';
            }
            function tick() {
                if (!liveMode) return;
                img.src = '/api/quad_latest?t=' + Date.now();
            }
            if (liveTimer) clearInterval(liveTimer);
            liveTimer = setInterval(tick, 800);
            tick();
        }

        function startReplayQuad() {
            followTimeline = true;
            if (!tlFrames.length) {
                loadTimeline(true);
                return;
            }
            showFrame(tlFrames.length - 1);
        }

        function stopPlay() {
            if (tlPlayTimer) { clearInterval(tlPlayTimer); tlPlayTimer = null; }
            const b = document.getElementById('btn-play'); if (b) b.textContent = '⏵ 播放';
        }

        async function loadTimeline(showLast = false) {
            const empty = document.getElementById('timeline-empty');
            try {
                const resp = await fetch('/api/timeline');
                const data = await resp.json();
                if (!data.exists || !(data.frames || []).length) {
                    document.getElementById('timeline-controls').style.display = 'none';
                    document.getElementById('quad-meta').innerHTML = '';
                    tlFrames = [];
                    if (!liveMode) startLiveQuad();
                    else markQuadMode('live');
                    return;
                }
                tlFrames = data.frames;
                document.getElementById('timeline-controls').style.display = 'block';
                const slider = document.getElementById('timeline-slider');
                slider.max = tlFrames.length - 1;
                const wonTag = data.won === true ? ' · <span style="color:#4ade80">✓落点已验证</span>' : '';
                document.getElementById('quad-meta').innerHTML =
                    `任务: <b>${data.task || '?'}</b>${wonTag}` +
                    `<br><span style="font-size:11px">采集于 ${data.created || ''} · ${tlFrames.length} 帧 · ${(data.cameras || []).join(' / ')}</span>`;
                if (showLast && followTimeline) {
                    showFrame(tlFrames.length - 1);
                } else if (liveMode) {
                    markQuadMode('live');
                    if (empty) empty.textContent = '正在直播。点「回放」可拖进度条看每步做完的截图。';
                } else {
                    const cur = parseInt(slider.value, 10) || 0;
                    showFrame(Math.min(cur, tlFrames.length - 1));
                }
            } catch (e) {
                if (!liveMode) startLiveQuad();
                empty.textContent = '时间线不可用，已显示实时画面。';
            }
        }

        function showFrame(i) {
            if (!tlFrames.length) return;
            stopLiveQuad();
            followTimeline = true;
            markQuadMode('replay');
            i = Math.max(0, Math.min(tlFrames.length - 1, parseInt(i)));
            const f = tlFrames[i];
            document.getElementById('quad-img').src = '/task_timeline/' + f.file + '?t=' + Date.now();
            document.getElementById('timeline-slider').value = i;
            document.getElementById('frame-label').textContent =
                `时间点 ${i + 1}/${tlFrames.length} · ${f.label} · t=${f.t}s`;
            const empty = document.getElementById('timeline-empty');
            if (empty) empty.textContent = '回放：每个子任务做完截的一帧。点「直播」回到当前画面。';
        }

        function stepFrame(d) {
            stopPlay();
            showFrame(parseInt(document.getElementById('timeline-slider').value) + d);
        }

        function playTimeline() {
            const btn = document.getElementById('btn-play');
            if (tlPlayTimer) { stopPlay(); return; }
            if (!tlFrames.length) return;
            btn.textContent = '⏸ 暂停';
            let i = parseInt(document.getElementById('timeline-slider').value);
            if (i >= tlFrames.length - 1) i = -1;
            tlPlayTimer = setInterval(() => {
                i++;
                if (i >= tlFrames.length) { stopPlay(); return; }
                showFrame(i);
            }, 900);
        }

        startLiveQuad();
        loadTimeline();
    </script>
<script>
async function loadExecutionEnvironment() {
    const box = document.getElementById('execution-environment');
    try {
        const response = await fetch('/api/execution_profile');
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '读取失败');
        const labels = {reception:'接待', execution:'通用执行 / 桌面整理', observation:'观察 / 当前画面'};
        box.textContent = data.routes ? Object.entries(data.routes).map(([key, route]) =>
            `${labels[key]}：${route.mode === 'real' ? '真机' : route.mode === 'simulation' ? '仿真' : '停用'} / ${route.backend}` +
            (route.available ? '' : ` — 不可用：${route.reason}`)).join('\n') : '尚未启用统一环境配置';
    } catch (e) { box.textContent = '环境状态暂不可用：' + e.message; }
}
loadExecutionEnvironment();
setInterval(loadExecutionEnvironment, 5000);
</script>
