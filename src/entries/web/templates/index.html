<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FQPlanner 任务控制台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 8px; font-size: 22px; color: #38bdf8; }
        .subtitle { text-align: center; margin-bottom: 28px; font-size: 13px; color: #64748b; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
        .card h2 { font-size: 15px; color: #94a3b8; margin-bottom: 14px; }
        .input-group { display: flex; gap: 8px; }
        input[type="text"] { min-width: 0; flex: 1; padding: 10px 14px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 14px; outline: none; }
        input[type="text"]:focus { border-color: #38bdf8; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; white-space: nowrap; }
        .btn-primary { background: #0ea5e9; color: #fff; }
        .btn-primary:hover { background: #0284c7; }
        .btn-outline { background: transparent; color: #94a3b8; border: 1px solid #334155; }
        .btn-outline:hover { border-color: #64748b; color: #e2e8f0; }
        .btn-sm { padding: 8px 14px; font-size: 13px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .result { margin-top: 14px; padding: 14px; background: #0f172a; border-radius: 8px; white-space: pre-wrap; font-size: 13px; font-family: inherit; line-height: 1.6; display: none; max-height: 180px; overflow-y: auto; }
        .status-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; font-size: 13px; color: #64748b; margin-bottom: 20px; }
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .dot.ok { background: #22c55e; }
        .dot.err { background: #ef4444; }
        .task-progress { margin-top: 14px; }
        .task-progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .task-progress-header span { font-size: 13px; color: #94a3b8; }
        .task-bar { height: 6px; background: #334155; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
        .task-bar-fill { height: 100%; background: #22c55e; border-radius: 3px; transition: width 0.3s, background 0.3s; }
        .task-bar-fill.fail { background: #ef4444; }
        .task-progress-header .status-ok  { color: #4ade80; }
        .task-progress-header .status-fail { color: #f87171; }
        .task-progress-header .status-run  { color: #94a3b8; }
        .task-progress-header .status-recovery { color: #fbbf24; }
        .task-bar-fill.recovery { background: #f59e0b; }
        .subtask-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #0f172a; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
        .subtask-item.done { opacity: 0.7; }
        .subtask-item .check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #475569; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; font-weight: bold; line-height: 1; }
        .subtask-item .subtask-text { flex: 1; color: #e2e8f0; }
        .subtask-item.done.ok .subtask-text { text-decoration: line-through; color: #64748b; }
        .subtask-item.done.fail .subtask-text { color: #f87171; font-weight: 500; }
        .subtask-item .subtask-robot { color: #64748b; font-size: 12px; }
        .no-task { color: #64748b; font-size: 13px; margin-top: 10px; }
        .report-card { margin-top: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FQPlanner 任务控制台</h1>
        <div class="subtitle">任务发布 · 进度跟踪 · 异常处理</div>
        <div class="status-bar">
            <span id="status">正在连接大脑…</span>
            <span id="execution-environment">正在读取接待环境…</span>
        </div>

        <!-- 任务发布 -->
        <div class="card">
            <h2>发布任务</h2>
            <div class="input-group">
                <input type="text" id="task" placeholder="输入任务，如：开始接待" autofocus>
                <button class="btn btn-primary" id="btn-send" onclick="sendTask()">发送</button>
            </div>
            <div class="result" id="task-result" role="status"></div>
            <button id="copy-task-response" class="btn btn-outline btn-sm" style="display:none;margin-top:8px" onclick="copyTaskResponse()">复制原始响应</button>
            <span id="copy-task-status" style="font-size:12px;color:#94a3b8" role="status"></span>
            <div class="task-progress" id="task-progress"></div>
            <div id="task-freshness" style="font-size:12px;color:#94a3b8" aria-live="polite"></div>
            <div id="task-command-feedback" style="white-space:pre-wrap;font-size:13px" aria-live="polite"></div>
            <div class="report-card" id="report-card"></div>
            <div class="btn-row" style="margin-top:10px">
                <button id="task-start" disabled class="btn btn-sm" style="background:#0ea5e9;color:#fff" onclick="startReception()">🤝 开始接待</button>
                <button id="task-start-nav" disabled class="btn btn-sm" style="background:#0369a1;color:#fff" title="与左侧同一接待流程：真实导航，开冰箱和抓可乐使用本地模拟，不执行真实操控" onclick="startReception('开始接待（导航真机＋操控模拟）')">🧭 开始接待（导航真机＋操控模拟）</button>
                <button id="task-skip" disabled class="btn btn-sm" style="background:#f59e0b;color:#111" onclick="controlReception('skip')">跳过继续</button>
                <button id="task-pause" disabled class="btn btn-sm" style="background:#64748b;color:#fff" onclick="controlReception('pause')">暂停</button>
                <button id="task-continue" disabled class="btn btn-sm" style="background:#22c55e;color:#fff" onclick="controlReception('continue')">继续</button>
                <button id="task-cancel" disabled class="btn btn-sm" style="background:#ef4444;color:#fff" onclick="controlReception('cancel')">取消任务</button>
                <button class="btn btn-outline btn-sm" onclick="refreshTaskStatus()">刷新任务进度</button>
                <button class="btn btn-outline btn-sm" onclick="loadReceptionReport()">本轮总结</button>
            </div>
        </div>

    </div>

    <script>
        const TASK_LABELS = {{ task_labels|tojson }};
        let lastTaskResponse = null;
        function taskReason(value) {
            const raw = value == null ? '' : (typeof value === 'string' ? value : JSON.stringify(value));
            return TASK_LABELS.reasons[raw] ? TASK_LABELS.reasons[raw] + '（' + raw + '）' : raw;
        }
        function taskPhase(value) { return displayedTask?.phase_labels?.[value] || TASK_LABELS.phases[value] || value || ''; }
        function showTaskResponse(data, heading) {
            lastTaskResponse = data;
            document.getElementById('copy-task-response').style.display = 'inline-block';
            const lines = [heading];
            if (data.task_id) lines.push('任务：' + data.task_id.slice(0, 8));
            if (data.state) lines.push('状态：' + (TASK_LABELS.states[data.state] || data.state));
            const reason = data.blocked_reason || data.error || data.message;
            if (reason) lines.push('说明：' + taskReason(reason));
            if (Array.isArray(data.blockers) && data.blockers.length) lines.push('原因：' + data.blockers.map(taskReason).join('；'));
            const result = document.getElementById('task-result');
            result.style.display = 'block';
            result.textContent = lines.join('\n');
        }
        async function copyTaskResponse() {
            const text = JSON.stringify({response: lastTaskResponse, current_task: displayedTask}, null, 2);
            const status = document.getElementById('copy-task-status');
            try {
                if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
                else {
                    const area = document.createElement('textarea');
                    area.value = text; area.style.position = 'fixed'; area.style.opacity = '0';
                    document.body.append(area); area.select();
                    try { if (!document.execCommand('copy')) throw new Error('copy failed'); }
                    finally { area.remove(); }
                }
                status.textContent = '已复制';
            } catch (e) { status.textContent = '复制失败，请重试或从浏览器网络面板查看原始响应'; }
        }

        // 状态检测
        async function checkStatus() {
            try {
                await readTaskStatus();
                document.getElementById('status').innerHTML = '<span><span class="dot ok"></span>大脑在线</span>';
            } catch {
                document.getElementById('status').innerHTML = '<span><span class="dot err"></span>大脑连接异常</span>';
            }
        }
        setTimeout(checkStatus, 0);
        setInterval(checkStatus, 5000);

        let taskSubmitting = false, taskControlPending = false, displayedTask = null;
        let taskReceiptId = null;
        let taskNoticeContext = null;
        let taskStatusKnown = false;
        let taskStatusLastReceived = 0, taskStatusError = '', statusReadPending = null;
        let pendingTaskControl = null, taskFeedbackTaskId = null;
        async function taskJSON(url, options = {}, timeoutMs = 8000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, {...options, signal: controller.signal, cache: 'no-store'});
                const data = await response.json();
                if (!response.ok) {
                    const error = new Error(data.error || '请求未完成');
                    error.definiteRejection = response.status >= 400 && response.status < 500;
                    throw error;
                }
                return data;
            } catch (error) {
                if (error.name === 'AbortError') throw new Error('请求超时，结果尚未确认');
                throw error;
            } finally { clearTimeout(timer); }
        }
        function readTaskStatus() {
            // Polling and button prechecks share one bounded read, never build a backlog.
            if (!statusReadPending) {
                statusReadPending = taskJSON('/api/task_status').then(data => {
                    if (!data || !Object.prototype.hasOwnProperty.call(data, 'state'))
                        throw new Error('大脑未返回有效任务状态');
                    return data;
                }).finally(() => { statusReadPending = null; });
            }
            return statusReadPending;
        }
        function updateTaskFreshness() {
            const age = taskStatusLastReceived ? Math.max(0, Math.floor((Date.now()-taskStatusLastReceived)/1000)) : null;
            const node = document.getElementById('task-freshness');
            node.textContent = taskStatusError
                ? (age === null ? '状态查询失败：' + taskStatusError : `连接异常，保留上次进度 · 距上次更新 ${age} 秒`)
                : age !== null && age >= 10 ? `状态待更新 · 距上次更新 ${age} 秒` : '';
            if (age >= 10 && taskStatusKnown) { taskStatusKnown = false; updateTaskButtons(); }
        }
        function markTaskStatus(data) {
            taskStatusLastReceived = Date.now(); taskStatusError = ''; taskStatusKnown = true;
            updateTaskFreshness();
            if ((taskFeedbackTaskId && taskFeedbackTaskId !== data.task_id) || data.terminal) {
                document.getElementById('task-command-feedback').textContent = '';
                taskFeedbackTaskId = null;
            }
            if (pendingTaskControl) {
                const p = pendingTaskControl;
                if (data.task_id !== p.task_id) pendingTaskControl = null;
                else if (data.control_command_id && data.control_command_id !== p.command_id) {
                    p.observed = true;
                    document.getElementById('task-command-feedback').textContent = '已观察到新命令：' + data.control_command_id;
                }
                // A fresh task status alone does not prove that a lost control request was rejected.
                if (p.observed || data.terminal) pendingTaskControl = null;
            }
        }
        function markTaskStatusError(error) {
            taskStatusKnown = false; taskStatusError = error.message;
            updateTaskButtons(); updateTaskFreshness();
        }
        setInterval(updateTaskFreshness, 1000);
        async function vlaEffectControl(action) {
            const current = displayedTask;
            if (!current?.task_id || !current.vla_confirmation?.command_id || taskControlPending) return;
            const identity = {task_id: current.task_id, command_id: current.vla_confirmation.command_id};
            taskControlPending = true;
            try {
                const response = await fetch('/api/task_vla/' + action, {
                    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(identity)});
                const result = await response.json();
                if (displayedTask?.task_id !== identity.task_id) return;
                document.getElementById('task-command-feedback').textContent = result.accepted
                    ? (action === 'pause' ? '暂停请求已处理，请查询确认实际暂停状态。' : '原命令状态已查询，请刷新任务状态。')
                    : (result.error || '请求未确认，请查询原命令');
            } catch (error) {
                if (displayedTask?.task_id === identity.task_id)
                    document.getElementById('task-command-feedback').textContent = '请求结果未知，请查询原命令。';
            } finally {
                taskControlPending = false;
                updateTaskButtons();
                await refreshTaskStatus();
            }
        }


        function updateTaskButtons() {
            const state = displayedTask?.state;
            const active = !!displayedTask?.task_id && !displayedTask.terminal;
            const ready = taskStatusKnown && !taskControlPending;
            const enabled = {
                start: ready && !taskSubmitting && !active && !displayedTask?.blocks_new_motion && !displayedTask?.control_recovery?.blocked,
                'start-nav': ready && !taskSubmitting && !active && !displayedTask?.blocks_new_motion && !displayedTask?.control_recovery?.blocked,
                skip: ready && active && !!displayedTask?.can_skip,
                pause: ready && active && (['running', 'verifying'].includes(state)
                    || (state === 'waiting_human' && !!displayedTask?.vla_confirmation)),
                continue: ready && active && !!displayedTask?.can_resume && !pendingTaskControl && !displayedTask?.control_recovery?.pending,
                cancel: ready && active
            };
            for (const [name, allowed] of Object.entries(enabled)) {
                const button = document.getElementById('task-' + name);
                button.disabled = !allowed;
                const descriptions = {start: '执行当前环境登记的接待 Skill', 'start-nav': '同一接待流程；导航真实，开门和抓可乐为模拟',
                    pause: '暂停整轮流程，并请求停止当前动作', continue: '继续当前环节；未完成则重新下发一次指令',
                    skip: '放弃当前环节并进入下一步，不记为成功', cancel: displayedTask?.control_recovery?.enabled
                        ? '取消本轮任务并请求停止，取消后可重新发布'
                        : '废弃整轮大脑任务；不向导航发送停止指令'};
                button.title = allowed ? descriptions[name] : (!taskStatusKnown ? '正在确认任务状态' : taskControlPending ? '控制请求处理中' : '当前任务状态不支持此操作');
            }
        }
        // 发布任务
        async function sendTask(options) {
            options = options || {};
            const task = document.getElementById('task').value.trim();
            if (!task || taskSubmitting) return;
            taskReceiptId = null;
            taskSubmitting = true;
            updateTaskButtons();
            const btn = document.getElementById('btn-send');
            const result = document.getElementById('task-result');
            btn.disabled = true;
            btn.textContent = '发送中...';
            result.style.display = 'block';
            result.textContent = '等待响应...';
            try {
                const intentResp = await fetch('/api/task_intent', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({task: task})
                });
                const intent = await intentResp.json();
                if (intent.intent === 'control') {
                    await controlReception(intent.action);
                    return;
                }
                if (intent.intent === 'chat') {
                    result.textContent = '识别为闲聊，未发送给大脑。机器人任务请说「开始接待」「桌上有什么」等。';
                    return;
                }
                if (intent.requires_confirmation && !options.skipConfirm) {
                    const kind = intent.risk === 'motion' ? '运动任务' : '机器人任务';
                    if (!window.confirm('将作为' + kind + '发给大脑：\n' + task)) {
                        result.textContent = '已取消';
                        return;
                    }
                }
                const st = await readTaskStatus();
                if (st.blocks_new_motion) {
                    showTaskResponse(st, '当前任务尚未结束，请先处理原任务。');
                    return;
                }
                const preflight = await taskJSON('/api/task_preflight', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({task: task})
                }, 12000);
                if (preflight.required && preflight.ready === false) {
                    showTaskResponse(preflight, '预检未通过，任务尚未提交。');
                    return;
                }
                document.getElementById('task-command-feedback').textContent = (preflight.warnings || []).join('\n');
                const payload = {task: task};
                if (options.forceNewTask) payload.force_new_task = true;
                const resp = await fetch('/publish_task', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await resp.json();
                showTaskResponse(data, !resp.ok || data.accepted === false || data.status === 'rejected'
                    ? '任务未被接受' : data.status === 'success' || data.accepted === true ? '任务已接收，进度见下方。' : '已收到大脑响应，请查看说明。');
                if (!resp.ok || data.accepted === false) {
                    return;
                }
                if (data.status === 'success' || data.accepted === true) {
                    taskReceiptId = data.task_id;
                    startTaskPolling();
                }
            } catch (e) {
                result.textContent = '请求失败: ' + e.message;
            } finally {
                taskSubmitting = false;
                updateTaskButtons();
                btn.disabled = false;
                btn.textContent = '发送';
                document.getElementById('task').value = '';
                if (taskReceiptId) await refreshTaskStatus();
            }
        }
        // 会议接待:一键触发(填"开始接待"→ master 命中接待 skill → 复用 task_status 显示 🧠+子任务✓)
        function startReception(text) {
            document.getElementById('task').value = text || '开始接待';
            sendTask({skipConfirm: true});
        }
        async function controlReception(action) {
            if (taskControlPending || (action === 'continue' && pendingTaskControl)) return;
            taskReceiptId = null;
            const result = document.getElementById('task-result');
            const target = displayedTask?.task_id;
            const skipStep = displayedTask?.skip_step_id;
            const continueStep = displayedTask?.control_step_id;
            const continueCommand = displayedTask?.control_command_id || '';
            taskNoticeContext = taskDisplayContext(displayedTask);
            taskControlPending = true;
            updateTaskButtons();
            result.style.display = 'block';
            try {
                const current = await readTaskStatus();
                if (target && current.task_id !== target) throw new Error('任务已变化，请刷新进度后再操作');
                if (!current.task_id || current.terminal) {
                    result.textContent = '当前没有进行中的任务，无需操作。';
                    return;
                }
                if (action === 'continue' && ((current.control_step_id || '') !== (continueStep || '')
                        || (current.control_command_id || '') !== continueCommand)) {
                    throw new Error('当前环节或命令已变化，请刷新后重试');
                }
                if (action === 'skip') {
                    if (!current.can_skip || !skipStep || current.skip_step_id !== skipStep) {
                        throw new Error('当前步骤已变化或不可跳过，请刷新后重试');
                    }
                    if (!window.confirm(`跳过 ${taskPhase(skipStep)} 并进入下一步？该步骤不会记为成功；下一步仍需满足真实接口的前置条件。`)) return;
                }
                result.textContent = '正在发送控制请求...';
                taskFeedbackTaskId = current.task_id;
                pendingTaskControl = {task_id: current.task_id, command_id: continueCommand, action};
                const data = await taskJSON('/api/task_' + action, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({task_id: current.task_id, ...(action === 'skip' ? {step_id: skipStep} : {}),
                        ...(action === 'continue' ? {step_id: continueStep || '', expected_command_id: continueCommand} : {})})
                });
                if (data.accepted === false) {
                    pendingTaskControl = null;
                    throw new Error(data.error || '控制未被受理');
                }
                if (data.accepted !== true) throw new Error('未取得明确的控制受理回执');
                pendingTaskControl = null;
                lastTaskResponse = data;
                taskReceiptId = current.task_id;
                const labels = {paused: '已暂停；继续将核对原动作，未完成则重新下发当前环节。',
                    running: '继续请求已受理；结果以下方任务进度为准。', verifying: '正在核验原任务结果。',
                    cancelled: '本轮任务已取消，不再执行后续步骤。', cancelling: '取消已受理，仍在确认停止。',
                    recovery_required: '前置条件或执行结果尚未满足，请查看任务中的具体原因。'};
                result.textContent = data.error || data.message || (data.retry_prepared ? '当前环节的新尝试已准备，前置检查通过后下发；执行结果见任务进度。' : null) || (action === 'skip'
                    ? `已人工跳过 ${data.skipped_step_id}；${data.next_step_id ? '下一步：' + data.next_step_id + '，执行结果见任务进度。' : '流程结束，含跳过，未全部成功。'}`
                    : labels[data.state] || '控制请求已受理。');
                document.getElementById('task-command-feedback').textContent = result.textContent;
            } catch (e) {
                if (e.definiteRejection) pendingTaskControl = null;
                result.textContent = pendingTaskControl
                    ? '控制请求结果待确认，请查询当前任务；不要重复点击继续。'
                    : '控制请求未完成：' + e.message;
                document.getElementById('task-command-feedback').textContent = result.textContent;
            } finally {
                taskControlPending = false;
                await refreshTaskStatus();
                updateTaskButtons();
            }
        }
        document.getElementById('task').addEventListener('keydown', e => { if (e.key === 'Enter') sendTask(); });

        // 任务进度
        let taskPollingTimer = null;
        let taskStatusRequest = 0, taskStatusApplied = 0;

        function taskText(value) {
            const node = document.createElement('span');
            node.textContent = String(value ?? '');
            return node.innerHTML;
        }

        function renderAttemptHistory(data) {
            const summary = data.attempt_summary || {};
            const oldAdvice = data.recovery_confirmation_enabled && data.recovery_advice && !currentRecoveryAdvice(data) ? data.recovery_advice : null;
            if (!summary.failure_count && !summary.retry_count && !oldAdvice && !data.plan_revisions?.length) return '';
            const title = `历史失败 ${Number(summary.failure_count) || 0} 次 · 重试 ${Number(summary.retry_count) || 0} 次（人工确认触发 ${Number(summary.manual_retry_count) || 0} 次）`;
            const rows = (data.failure_history || []).map(item =>
                `<div style="margin:8px 0"><strong>失败环节：${taskText(taskPhase(item.step_id))}</strong>
                <div>失败原文：${taskText(item.message || item.code || '未提供')}</div>
                <div>回包说明：${taskText(failureExplanation(item))}</div>
                <small>命令：${taskText(item.command_id)} · 错误码：${taskText(item.code || '未提供')}</small>
                ${failureReceiptDetails(item, item.command_id)}</div>`).join('');
            const revisions = (data.plan_revisions || []).map(change => '<div style="margin:8px 0"><strong>恢复方案版本 '
                + taskText(change.version) + '</strong><div>' + taskText(change.summary) + '</div><small>原失败命令：'
                + taskText(change.original_command_id) + '</small><details><summary>调整前后与依据</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'
                + taskText(JSON.stringify(change, null, 2)) + '</pre></details></div>').join('');
            return `<details data-task-detail="history:${encodeURIComponent(data.task_id || '')}"><summary>${taskText(title)}</summary>${rows}${revisions}
                ${oldAdvice ? '<div>历史建议（已失效或已处理）</div>' + recoveryAdviceDetails(oldAdvice, data) : ''}</details>`;
        }

        function taskDisplayContext(data) {
            return JSON.stringify([data?.task_id, data?.state, data?.control_step_id, data?.control_command_id]);
        }

        function renderTaskProgress(data) {
            displayedTask = data;
            taskStatusKnown = true;
            const result = document.getElementById('task-result');
            if (taskNoticeContext && taskNoticeContext !== taskDisplayContext(data) && !taskControlPending) {
                taskNoticeContext = null;
                result.style.display = 'none';
                result.textContent = '';
            }
            if (taskReceiptId && taskReceiptId !== data.task_id) {
                taskReceiptId = null;
                result.style.display = 'none';
            }
            if (data.task_id) document.getElementById('copy-task-response').style.display = 'inline-block';
            updateTaskButtons();
            if (!data.all_done) document.getElementById('report-card').innerHTML = '';
            const el = document.getElementById('task-progress');
            if (!data.active && !data.all_done && data.state !== 'succeeded' && data.state !== 'cancelled' && data.state !== 'failed') {
                el.innerHTML = '<div class="no-task">暂无执行中的任务</div>';
                return;
            }
            const tasks = data.subtask_list || [];
            const skippedCount = tasks.filter(t => t.status === 'skipped' || t.skipped).length;
            const completed = tasks.filter(t => t.done && !t.skipped && (!t.status || t.status === 'success')).length;
            const total = Number(data.total) || 0;
            const remaining = Math.max(0, total - completed - skippedCount);
            const pct = total > 0 ? Math.round(completed / total * 100) : 0;
            const taskName = Array.isArray(data.task) ? data.task[0] : (data.task || '');
            const recovery = data.state === 'RECOVERY_REQUIRED' || data.state === 'recovery_required';
            const failure = data.failure_detail;
            const anyFailed = !recovery && (data.failed || (data.subtask_list || []).some(
                t => t.status === 'failure' || (t.done && t.status && !['success', 'blocked', 'skipped'].includes(t.status))
            ));
            // MuJoCo 判定:任务成功 = 所有子任务都成功(不再用 ALFWorld 的 won 覆盖)。
            // won===true 时额外标"落点已验证"徽章;won===false 是 MuJoCo 非持续模式默认值,不代表失败,忽略。
            const wonSignal = data.hasOwnProperty('won') ? data.won : null;
            let statusLabel, statusCls;
            if (recovery && data.pause_requested) {
                statusLabel = '流程已暂停，当前动作停止尚未确认';
                statusCls = 'status-recovery';
            } else if (recovery) {
                statusLabel = failure && failure.kind === 'rejected' ? '指令被拒绝，未开始执行'
                    : '等待处理';
                statusCls = 'status-recovery';
            } else if (data.state === 'paused') {
                statusLabel = '已暂停';
                statusCls = 'status-run';
            } else if (data.state === 'waiting_human') {
                statusLabel = '等待人工';
                statusCls = 'status-run';
            } else if (data.state === 'cancelling') {
                statusLabel = '取消中，停止尚未核清';
                statusCls = 'status-recovery';
            } else if (data.state === 'cancelled') {
                statusLabel = '本轮任务已取消';
                statusCls = 'status-fail';
            } else if (data.state === 'failed') {
                statusLabel = data.flow_finished ? '流程结束（含人工跳过，未全部成功）' : '已失败';
                statusCls = 'status-fail';
            } else if (data.all_done || data.state === 'succeeded') {
                if (skippedCount) {
                    statusLabel = '流程结束（含人工跳过，未全部成功）';
                    statusCls = 'status-fail';
                } else if (anyFailed || completed < total) {
                    statusLabel = '任务未全部成功，请查看各步骤结果';
                    statusCls = 'status-fail';
                } else {
                    statusLabel = data.execution_backend === 'reception_protocol' ? '✓ 协议模拟完成'
                        : ['reception_real_sim_manipulation', 'reception_ros_sim_manipulation'].includes(data.execution_backend) ? '✓ 混合流程完成（操控为模拟）'
                        : data.execution_backend === 'reception_simple' ? '✓ SIMPLE 物理仿真完成'
                        : wonSignal === true ? '✓ 任务成功(落点已验证)' : '✓ 任务成功';
                    statusCls = 'status-ok';
                }
            } else {
                const stage = data.current_command?.stage;
                statusLabel = data.state === 'verifying' ? '正在核验执行结果'
                    : stage === 'unknown' ? '原命令执行结果待确认'
                    : stage === 'submitted' ? '等待动作执行结果'
                    : !data.current_command?.command_id || stage === 'prepared' ? '等待下发当前步骤'
                    : '正在处理当前步骤';
                statusCls = 'status-run';
            }
            const barCls = recovery || skippedCount ? 'task-bar-fill recovery' : (anyFailed ? 'task-bar-fill fail' : 'task-bar-fill');
            let html = `<div class="task-progress-header">
                <span>${taskText(taskName)} · 成功 ${completed}/${total} · 跳过 ${skippedCount} · 未完成 ${remaining}${data.execution_backend === 'reception_protocol' ? ' · 导航／操控模拟' : data.execution_backend === 'reception_simple' ? ' · SIMPLE 物理仿真' : ''}</span>
                <span class="${statusCls}">${taskText(statusLabel)}</span>
            </div>
            <div class="task-bar"><div class="${barCls}" style="width:${pct}%"></div></div>`;
            html += `<div style="font-size:12px;color:#94a3b8;overflow-wrap:anywhere">
                任务 ID：${taskText(data.task_id)} · 任务环境：${taskText((TASK_LABELS.backends || {})[data.execution_backend] || data.execution_backend || '尚未选择')}</div>`;

            const vla = data.vla_confirmation;
            const holdingStatus = data.failure_detail?.downstream?.error?.details?.holding_status
                || data.handoff_observation?.idle_evidence?.vla;
            const holdingProof = holdingStatus?.holding_evidence || vla?.holding_evidence;
            if (holdingProof) {
                const expired = !Number.isFinite(Date.parse(holdingProof.valid_until))
                    || Date.parse(holdingProof.valid_until) <= Date.now();
                html += '<div class="task-command-feedback">持物证据（最近核查快照）：'
                    + taskText(holdingStatus ? (holdingStatus.current_holding || '未知') : (holdingProof.holding || '未知'))
                    + '<br>观察时间：' + taskText(holdingProof.observed_at || '未提供')
                    + ' · 有效至：' + taskText(holdingProof.valid_until || '未提供')
                    + '<br>' + taskText(holdingProof.invalid_reason || (expired ? '证据已到期，须真实重新确认'
                        : holdingProof.valid === true ? '每段运送前重新核查当前证明，不自动续期' : '证明无效，等待核清'))
                    + '</div>';
            }
            if (vla && !data.pause_requested) {
                const labels = {running:'策略运行中，请在现场确认适当时机后请求暂停',
                    waiting_result_confirmation:'策略已暂停，等待授权核验方提交暂停后的效果证据',
                    stopping_policy:'效果已提交，正在确认策略停止', restoring_navigation:'正在归还导航通路',
                    succeeded:'VLA 已返回成功；点击继续，由大脑核验原结果',
                    failed:'VLA 已返回失败，请核清现场', cancelled:'VLA 命令已取消，请核清现场'};
                html += '<div class="task-command-feedback">' + taskText(labels[vla.state] || '等待核对 VLA 原命令')
                    + '<br>策略暂停不是姿态冻结或急停。效果证据由现场人员或视觉核验模块提供。'
                    + (vla.state === 'running' && !vla.pause_requested
                        ? '<button type="button" onclick="vlaEffectControl(\'pause\')">暂停策略以核验</button>' : '')
                    + '<button type="button" onclick="vlaEffectControl(\'query\')">查询操控原命令</button></div>';
            }
            const command = data.current_command;
            if (command?.command_id) {
                const stages = {prepared:'新命令已准备，尚未下发', submitted:'下发已登记，等待执行回执',
                    unknown:'执行结果待确认，不会自动补发', rejected:'指令被拒绝，未开始执行',
                    succeeded:'已核验成功', failed:'执行失败', cancelled:'命令已取消', terminal:'已收到终态，等待核验'};
                html += '<div style="font-size:12px;overflow-wrap:anywhere">' + taskText(stages[command.stage] || '等待核对')
                    + ' · ' + taskText(command.command_id) + '</div>';
            }
            const phase = data.phase || data.control_step_id;
            const reason = data.blocked_reason || '';
            if (taskReceiptId && !taskControlPending && !taskSubmitting) {
                result.style.display = 'block';
                result.textContent = statusLabel;
            }
            if (!data.terminal && !['failed', 'succeeded', 'cancelled'].includes(data.state) && !recovery && (phase || reason)) {
                const lines = [];
                if (phase) lines.push('当前步骤：' + taskPhase(phase));
                if (reason && ['paused', 'waiting_human'].includes(data.state)) lines.push('原因：' + taskReason(reason));
                html += '<div style="margin:10px 0;padding:10px 12px;background:#0f172a;border-radius:8px;font-size:13px;line-height:1.6">'
                    + lines.map(taskText).join('<br>') + '</div>';
            }

            html += renderRecoveryAdvice(data);
            html += renderAttemptHistory(data);
            for (const t of (data.subtask_list || [])) {
                const skipped = t.status === 'skipped';
                const blocked = t.done && (t.status === 'blocked' || skipped);
                const failed = t.status === 'failure' || (t.done && t.status && t.status !== 'success' && t.status !== 'blocked' && !skipped);
                const cls = failed ? 'fail' : t.done ? (blocked ? 'done' : 'done ok') : '';
                const insertedTag = t.inserted
                    ? ' <span style="font-size:10px;color:#fbbf24;border:1px solid #fbbf24;border-radius:4px;padding:1px 5px">↻ 失败重插</span>'
                    : '';
                const blockedTag = blocked
                    ? ' <span style="font-size:10px;color:#fbbf24;border:1px solid #475569;border-radius:4px;padding:1px 5px">' + (skipped ? '人工跳过，未确认成功' : '未执行') + '</span>'
                    : '';
                let checkStyle = 'border-color:#475569;';
                let checkIcon = '';
                if (t.done || failed) {
                    if (failed) {
                        checkStyle = 'background:#ef4444;border-color:#ef4444;color:#fff;';
                        checkIcon = '✕';
                    } else if (blocked) {
                        checkStyle = 'background:#334155;border-color:#475569;color:#cbd5e1;';
                        checkIcon = '⊘';
                    } else {
                        checkStyle = 'background:#22c55e;border-color:#22c55e;color:#fff;';
                        checkIcon = '✓';
                    }
                }
                html += `<div class="subtask-item ${cls}">
                    <div class="check" style="${checkStyle}">${checkIcon}</div>
                    <span class="subtask-text">${taskText(t.display_name || data.phase_labels?.[t.step_id] || TASK_LABELS.phases[t.step_id] || TASK_LABELS.phases[t.subtask] || t.subtask)}${t.simulated ? '（模拟）' : ''}${insertedTag}${blockedTag}</span>
                    <span class="subtask-robot">${taskText(t.robot_name)}</span>
                </div>`;
            }
            if (data.state === 'cancelled' && !data.control_recovery?.blocked) {
                result.style.display = 'none';
                result.textContent = '';
                const unresolved = data.command_unknown || data.blocks_new_motion;
                html = '<div class="no-task">暂无执行中的任务</div>'
                    + (unresolved ? '<div class="status-recovery">任务已取消；原命令仍需核清，暂不能开始新任务。</div>' : '')
                    + '<details data-task-detail="cancelled:' + encodeURIComponent(data.task_id || '')
                    + '"><summary>上一轮已取消 · 查看记录</summary>' + html + '</details>';
            }
            const expanded = new Set(Array.from(el.querySelectorAll?.('details[open][data-task-detail]') || [])
                .map(node => node.dataset.taskDetail));
            el.innerHTML = html;
            for (const node of el.querySelectorAll?.('details[data-task-detail]') || []) {
                node.open = expanded.has(node.dataset.taskDetail);
            }
        }

        const adviceActionLabels = {query_original: '确认查询原命令（不重试）', continue: '确认继续当前环节（可能重试）',
            observe_scene: '读取现场并重新分析（不执行动作）', revise_plan: '确认按此方案恢复执行',
            cancel: '确认结束本轮任务（不代表机器人停止）', wait: '确认等待', request_help: '确认由人工处理'};
        function currentRecoveryAdvice(data) {
            const advice = data.recovery_advice;
            if (!data.recovery_confirmation_enabled || !advice?.applicable || data.terminal
                    || !['recovery_required', 'waiting_human', 'paused'].includes(data.state)) return null;
            if (advice.task_id !== data.task_id || advice.step_id !== data.control_step_id
                    || (advice.control_command_id || '') !== (data.control_command_id || '')) return null;
            if ((data.advice_confirmations || []).some(r => r.advice_id === advice.advice_id)) return null;
            return advice;
        }
        function failureExplanation(failure) {
            const raw = String(failure.message || '');
            if (failure.code === 'STATIC_ACTIVATION_UNCONFIRMED') {
                const details = failure.downstream?.error?.details;
                return details?.current_prepare_blockers?.length ? raw
                    : TASK_LABELS.reasons.STATIC_ACTIVATION_UNCONFIRMED;
            }
            const translated = String(failure.display_message || '').split('；原始错误：')[0];
            if (translated) return translated;
            const phrase = Object.entries(TASK_LABELS.failure_phrases || {}).find(([key]) => raw.includes(key));
            if (phrase) return phrase[1];
            return TASK_LABELS.reasons[failure.code] || TASK_LABELS.reasons[raw]
                || '下游返回了新的错误原因，请查看原文及回包详情。';
        }
        function failureReceiptDetails(failure, commandId) {
            if (!failure?.downstream || !Object.keys(failure.downstream).length) return '';
            return '<details data-task-detail="receipt:' + encodeURIComponent(commandId || '')
                + '"><summary>下游原始错误与结果</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'
                + taskText(JSON.stringify({command_id: commandId, downstream: failure.downstream}, null, 2))
                + '</pre></details>';
        }
        function recoveryAdviceDetails(advice, data) {
            return '<details data-task-detail="advice:' + encodeURIComponent(advice.advice_id || '') + '"><summary>详细信息</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'
                + taskText(JSON.stringify({source: advice.source, command_id: advice.command_id,
                    summary: advice.summary, reason: advice.reason, plan: advice.plan, facts: advice.facts,
                    plan_revisions: data.plan_revisions,
                    error: advice.error, confirmations: (data.advice_confirmations || []).filter(r => r.advice_id === advice.advice_id)}, null, 2))
                + '</pre></details>';
        }
        function renderRecoveryAdvice(data) {
            if (data.terminal || ['running', 'verifying', 'succeeded', 'failed', 'cancelled'].includes(data.state)) return '';
            const advice = currentRecoveryAdvice(data);
            const failure = data.failure_detail || (data.state === 'recovery_required' && data.blocked_reason
                ? {message: data.blocked_reason, display_message: TASK_LABELS.reasons[data.blocked_reason]} : null);
            if (!failure && !advice) return '';
            const phase = data.control_step_id || data.phase;
            const line = (label, value) => '<div style="margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere"><strong>'
                + taskText(label) + '：</strong>' + taskText(value) + '</div>';
            let html = '<div class="recovery-advice" style="margin:12px 0;padding:12px;border:1px solid #475569;border-radius:8px">';
            html += line(failure ? '失败环节' : '当前环节', taskPhase(phase));
            if (failure) {
                const raw = failure.message || failure.code || '未提供原始错误';
                if (failure.code === 'STATIC_ACTIVATION_UNCONFIRMED') {
                    html += line('失败原因', failureExplanation(failure));
                } else {
                    html += line('失败原文', raw + (failure.code && !raw.includes(failure.code) ? '（' + failure.code + '）' : ''));
                    html += line('回包说明', failureExplanation(failure));
                }
                html += failureReceiptDetails(failure, data.control_command_id);
            }
            if (advice) {
                const suggestions = {query_original: '先查询原命令，确认执行结果。',
                    observe_scene: '只读刷新执行端状态和场景，再由模型分析下一步；不代表重新拍照或识别。',
                    revise_plan: '按以下顺序完成原任务，执行前仍会核查原命令和前置条件。',
                    continue: '确认执行条件后继续当前环节。', cancel: '取消本轮任务；此操作不代表机器人停止。',
                    wait: '等待执行条件恢复。', request_help: '请现场人员检查并处理。'};
                html += line('建议', suggestions[advice.action] || '请核对现场情况。');
                if (['observe_scene', 'revise_plan'].includes(advice.action)) {
                    html += line(advice.source === 'llm' ? '模型解释（非执行回包）' : '规则说明', advice.summary + '\n' + advice.reason);
                }
                if (advice.action === 'revise_plan' && Array.isArray(advice.plan?.step_order)) {
                    const steps = Object.fromEntries((data.subtask_list || []).map(s => [s.step_id, s.display_name || s.subtask]));
                    html += '<ol>' + advice.plan.step_order.map(id => '<li>'
                        + taskText(steps[id] && steps[id] !== id ? steps[id] : taskPhase(id)) + '</li>').join('') + '</ol>';
                    html += line('依据', '本次读取的现场证据 ' + advice.plan.observation_id);
                }
                html += recoveryAdviceDetails(advice, data);
                if (adviceActionLabels[advice.action]) {
                    html += '<button class="btn btn-outline btn-sm" onclick="confirmRecoveryAdvice()" ' + (taskControlPending || (pendingTaskControl && ['continue', 'revise_plan'].includes(advice.action)) ? 'disabled' : '') + '>'
                        + taskText(adviceActionLabels[advice.action]) + '</button>';
                }
            } else if (!failure?.downstream || !Object.keys(failure.downstream).length) {
                html += '<details data-task-detail="failure:' + encodeURIComponent(data.task_id + ':' + data.control_command_id) + '"><summary>详细信息</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'
                    + taskText(JSON.stringify({command_id: data.control_command_id, failure}, null, 2)) + '</pre></details>';
            }
            return html + '</div>';
        }
        async function confirmRecoveryAdvice() {
            if (taskControlPending) return;
            const shown = displayedTask;
            const advice = shown && currentRecoveryAdvice(shown);
            if (!advice?.applicable || !advice.advice_id) return;
            if (pendingTaskControl && ['continue', 'revise_plan'].includes(advice.action)) return;
            if (!window.confirm((adviceActionLabels[advice.action] || '') + '？仅授权本次操作，不修改长期规则。')) return;
            taskNoticeContext = taskDisplayContext(shown);
            taskControlPending = true;
            updateTaskButtons();
            const el = document.getElementById('task-result');
            el.style.display = 'block';
            el.textContent = '正在确认建议...';
            try {
                const response = await fetch('/api/task_advice/confirm', {method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({task_id: shown.task_id, advice_id: advice.advice_id, expected_revision: advice.record_revision})});
                const result = await response.json();
                if (!response.ok || result.accepted === false) throw new Error(result.error || '确认未被受理');
                el.textContent = result.message || '确认已记录，处理结果见任务进度；受理不等于动作完成。';
            } catch (error) {
                el.textContent = '建议确认未完成或回执未知，请刷新核对原任务：' + error.message;
            } finally {
                taskControlPending = false;
                await refreshTaskStatus();
                updateTaskButtons();
            }
        }

        let reportContext = '', reportRequest = 0, receptionSummary = '';
        async function refreshTaskStatus() {
            const requestId = ++taskStatusRequest;
            try {
                const data = await readTaskStatus();
                if (requestId < taskStatusApplied) return;
                taskStatusApplied = requestId;
                markTaskStatus(data);
                renderTaskProgress(data);
                const context = JSON.stringify([data.task_id, data.state, data.control_command_id]);
                if (context !== reportContext) {
                    reportContext = context;
                    ++reportRequest;
                    document.getElementById('report-card').innerHTML = '';
                    if (data.task_type === 'reception' && !['running','verifying','cancelled'].includes(data.state)) loadReceptionReport();
                }
                if (data.active && !data.all_done) {
                    // 只在没启动轮询时才启动（手动刷新按钮触发时需要）
                    if (!taskPollingTimer) startTaskPolling();
                } else {
                    stopTaskPolling();
                }
            } catch (e) {
                if (requestId < taskStatusApplied) return;
                taskStatusApplied = requestId;
                markTaskStatusError(e);
                if (taskReceiptId && !taskControlPending && !taskSubmitting) {
                    document.getElementById('task-result').textContent = '状态查询失败，暂时无法确认最新执行结果。';
                }
            }
        }

        // 接待完成确认报告：从 Master 的当前 Runtime 读取。
        async function loadReceptionReport() {
            const el = document.getElementById('report-card');
            const taskId = displayedTask?.task_id, state = displayedTask?.state;
            const commandId = displayedTask?.control_command_id;
            const stillCurrent = () => requestId === reportRequest && displayedTask?.task_id === taskId
                && displayedTask?.state === state && displayedTask?.control_command_id === commandId;
            const requestId = ++reportRequest;
            try {
                const d = await taskJSON('/api/reception/report');
                if (!stillCurrent()) return;
                if (!d.success || !d.report || d.report.task_id !== taskId) { el.innerHTML = ''; return; }
                if (d.report.state !== state) return;
                receptionSummary = d.report.summary_text || '';
                el.innerHTML = '<details><summary>' + (state === 'cancelled' ? '上一轮总结' : '本轮总结')
                    + ' · ' + taskText(TASK_LABELS.states[d.report.state] || d.report.state) + '</summary>'
                    + '<pre style="white-space:pre-wrap;overflow-wrap:anywhere">' + taskText(receptionSummary) + '</pre>'
                    + '<button class="btn btn-outline btn-sm" onclick="copyReceptionSummary()">复制总结</button>'
                    + '<span id="copy-summary-status" role="status"></span></details>';
            } catch (e) {
                if (stillCurrent())
                    el.textContent = '本轮总结暂未取得，请重试查询。';
            }
        }
        async function copyReceptionSummary() {
            const el = document.getElementById('copy-summary-status');
            try {
                if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(receptionSummary);
                else {
                    const area = document.createElement('textarea'); area.value = receptionSummary;
                    document.body.appendChild(area); area.select();
                    try { if (!document.execCommand('copy')) throw new Error('copy failed'); }
                    finally { area.remove(); }
                }
                el.textContent = '已复制';
            } catch (e) { el.textContent = '复制失败，请选中上方文字复制'; }
        }

        function startTaskPolling() {
            stopTaskPolling();
            taskPollingTimer = setInterval(refreshTaskStatus, 1000);
            refreshTaskStatus();
        }

        function stopTaskPolling() {
            if (taskPollingTimer) {
                clearInterval(taskPollingTimer);
                taskPollingTimer = null;
            }
        }

        // 首次加载恢复当前任务；随后发现外部触发的新任务时开始轮询。
        let _autoSeenTaskId = null;
        async function autoDetectNewTask() {
            if (taskPollingTimer) return;                 // 已在快速轮询,不干预
            const requestId = ++taskStatusRequest;
            try {
                const d = await readTaskStatus();
                if (requestId < taskStatusApplied || taskPollingTimer) return;
                taskStatusApplied = requestId;
                markTaskStatus(d);
                displayedTask = d;
                updateTaskButtons();
                const tid = d.task_id || '';
                if (_autoSeenTaskId === null) {
                    _autoSeenTaskId = tid;
                    displayedTask = d;
                    updateTaskButtons();
                    if (d.task_id) {
                        renderTaskProgress(d);
                        if (d.state !== 'cancelled') loadReceptionReport();
                    }
                    if (d.active && !d.all_done) {
                        startTaskPolling();
                    }
                    return;
                }
                if (tid && tid !== _autoSeenTaskId && d.active) {                 // 新 task_id = 刚被外部触发
                    _autoSeenTaskId = tid;
                    startTaskPolling();
                }
            } catch (e) {
                if (requestId < taskStatusApplied) return;
                taskStatusApplied = requestId;
                markTaskStatusError(e);
            }
        }
        setInterval(autoDetectNewTask, 3000);
        // Fetch immediately after the script has initialized all polling variables.
        setTimeout(autoDetectNewTask, 0);

    </script>
<script>
async function loadExecutionEnvironment() {
    const box = document.getElementById('execution-environment');
    try {
        const data = await taskJSON('/api/execution_profile');
        const route = data.routes?.reception;
        box.textContent = route ? '接待环境：' + (TASK_LABELS.backends[route.backend]
            || ({real:'真机', simulation:'仿真', disabled:'停用'}[route.mode]) || '未确认')
            + (route.available ? '' : '（不可用）') : '接待环境：未配置';
        box.title = route?.available === false ? route.reason || '接待环境不可用' : '';
    } catch (e) { box.textContent = '环境状态暂不可用：' + e.message; }
}
loadExecutionEnvironment();
setInterval(loadExecutionEnvironment, 5000);
</script>
