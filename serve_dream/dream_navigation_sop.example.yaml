execution_rules:
- 所有点位固定使用 map 坐标系，goal_xyt 的 yaw 必须是弧度。
- POST 返回 202/accepted 只表示接收；必须轮询到 state=succeeded 且 result.success=true 才算到达。
- 过门必须拆成门外接近和横移出门两条命令，等待前一段 succeeded 后才能发送后一段。
- 两段门任务必须使用同一个 task_id，leg_index 递增。
- lateral_path_aligned 只允许 target_id=door_1 的审核门出口段，不得用于任意目标。
- 不得把门外点、门出口点和 table1 合成一条普通折线路径。
- 横移成功后，前往 table1 必须另发 forward_path 命令并等待终态。
- failed/cancelled/超时不能伪造成到达；取消会锁定导航并撤销定位批准，继续前需现场重新审核。
