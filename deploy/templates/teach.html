<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人类示范学习 · 上传视频更新 SOP</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0;
         min-height: 100vh; padding: 32px 20px; line-height: 1.5; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  .card h3 { font-size: 14px; color: #cbd5e1; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: #94a3b8; margin: 10px 0 4px; }
  input[type=text], input[type=file] { width: 100%; padding: 9px 12px; border: 1px solid #334155;
         border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 14px; outline: none; }
  input[type=text]:focus { border-color: #38bdf8; }
  .btn { margin-top: 14px; padding: 10px 20px; border: none; border-radius: 8px; background: #0ea5e9;
         color: #fff; font-size: 14px; cursor: pointer; }
  .btn:hover { background: #0284c7; } .btn:disabled { opacity: .5; cursor: default; }
  .btn-save { background: #16a34a; } .btn-save:hover { background: #15803d; }
  #status { margin-top: 12px; font-size: 13px; color: #cbd5e1; min-height: 20px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #38bdf8; margin-right: 6px;
         animation: blink 1s infinite; } @keyframes blink { 50% { opacity: .3; } }
  .muted { color: #64748b; font-size: 12px; } .err { color: #ef4444; }
  .seg { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; font-size: 13px; border-bottom: 1px solid #223; }
  .seg .t { color: #64748b; font-family: ui-monospace, monospace; font-size: 12px; min-width: 92px; }
  .seg .act { color: #e2e8f0; flex: 1; } .seg .obj { color: #38bdf8; font-size: 12px; }
  .seg .conf { color: #64748b; font-size: 11px; }
  .lbl { font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  .lbl.ts { color: #a78bfa; } .lbl.gl { color: #4ade80; }
  .item { font-size: 13px; color: #cbd5e1; padding: 3px 0 3px 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🎥 人类示范学习</h1>
    <div class="sub">上传一段人类示范视频 → 自动拆解动作 + 提炼记忆/规则 → 确认写进 SOP。<b>换任务只改下面的"任务描述",不用碰代码。</b></div>

    <div class="card">
      <label>任务描述(传给 VLM 和提炼器,换任务改这里)</label>
      <input type="text" id="task" value="会议接待补货:从茶水间取可乐送会议室并间隔摆放">
      <label>示范视频(第一人称最好;mp4/mov)</label>
      <input type="file" id="video" accept="video/*">
      <button class="btn" id="go" onclick="parse()">上传并解析</button>
      <div id="status"></div>
    </div>

    <div id="out" hidden>
      <div class="card">
        <h3>① 动作拆解(video_to_actions · qwen3-vl-plus)</h3>
        <div id="summary" class="muted" style="margin-bottom:8px"></div>
        <div id="segments"></div>
      </div>
      <div class="card">
        <h3>② 分层提炼(learn_from_demo · 只提视频真支持的,反幻觉)</h3>
        <div id="task-specific"></div>
        <div id="global"></div>
        <button class="btn btn-save" id="save" onclick="save()">确认落盘(写进 Task Specific 记忆 + Global/SOP)</button>
        <div id="save-msg" style="margin-top:10px;font-size:13px"></div>
      </div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let timer = null;

async function parse() {
  const vf = $('video').files[0];
  if (!vf) { alert('先选一个视频文件'); return; }
  const task = $('task').value.trim() || '会议接待补货';
  $('go').disabled = true; $('out').hidden = true; $('status').innerHTML = '上传中…(视频大的话稍等)';
  const fd = new FormData();
  fd.append('video', vf); fd.append('task', task);
  try {
    const d = await (await fetch('/api/demo/parse', {method:'POST', body: fd})).json();
    if (!d.success) throw new Error(d.error || '上传失败');
    $('status').innerHTML = '✅ 已上传,开始解析…';
    poll();
  } catch (e) {
    $('status').innerHTML = '<span class="err">出错: ' + esc(e.message) + '</span>';
    $('go').disabled = false;
  }
}

// 轮询解析进度(上传→抽帧+VLM→提炼→完成);VLM 看视频要几十秒
function poll() {
  if (timer) clearInterval(timer);
  timer = setInterval(async () => {
    let st;
    try { st = await (await fetch('/api/demo/status')).json(); } catch (e) { return; }
    $('status').innerHTML = st.error
      ? '<span class="err">出错: ' + esc(st.detail) + '</span>'
      : `<span class="dot"></span>${esc(st.phase)} <span class="muted">${esc(st.detail||'')}</span>`;
    if (st.done) {
      clearInterval(timer); timer = null; $('go').disabled = false;
      if (!st.error) finish();
    }
  }, 2000);
}

async function finish() {
  const d = await (await fetch('/api/demo/result')).json();
  if (!d.success) { $('status').innerHTML = '<span class="err">拿不到结果</span>'; return; }
  $('summary').innerHTML = `<b>任务:</b> ${esc(d.task)}　<b>摘要:</b> ${esc(d.task_summary)}`;
  $('segments').innerHTML = (d.segments||[]).map(s =>
    `<div class="seg"><span class="t">${esc(s.start_time)}~${esc(s.end_time)}s</span>`
    + `<span class="act">${esc(s.action)}</span><span class="obj">${esc(s.object||'')}</span>`
    + `<span class="conf">${s.confidence!=null?('conf '+esc(s.confidence)):''}</span></div>`).join('');
  $('task-specific').innerHTML = '<div class="lbl ts">① Task Specific Memory(这次示范的具体实例:哪里取/放哪/特情)</div>'
    + ((d.task_specific||[]).map(x=>`<div class="item">◦ ${esc(x)}</div>`).join('') || '<div class="muted">(无)</div>');
  $('global').innerHTML = '<div class="lbl gl">② Global Memory / SOP(通用规则)</div>'
    + ((d.global_rules||[]).map(x=>`<div class="item">+ ${esc(x)}</div>`).join('')
       || '<div class="muted">(无——这次没有明确支持、又不与现有 SOP 重复的新通用规则)</div>');
  $('save').disabled = false; $('save-msg').innerHTML = '';
  $('out').hidden = false;
}

async function save() {
  $('save').disabled = true; $('save-msg').innerHTML = '落盘中…';
  try {
    const d = await (await fetch('/api/demo/save', {method:'POST'})).json();
    if (!d.success) throw new Error(d.error || '落盘失败');
    $('save-msg').innerHTML = `<span style="color:#4ade80">✅ 已落盘</span> `
      + `<span class="muted">Task Specific ${d.task_specific.length} 条 → reception_memory；`
      + `Global ${d.global_rules.length} 条 → global_memory + SOP</span>`;
  } catch (e) {
    $('save-msg').innerHTML = '<span class="err">落盘出错: ' + esc(e.message) + '</span>';
    $('save').disabled = false;
  }
}
</script>
</body>
</html>
